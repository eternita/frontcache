frontcache {
         
     console {
        urls = ["https://www.example.com:443/", "https://www123.example.com:443/"]
        apiKey = default-api-key

        # The console's single login (one user, no roles). The console can invalidate the cache of
        # every node listed above and holds the api-key that authorizes it, so leaving these out
        # makes it a credentialed proxy in front of an authenticated fleet.
        #
        # CHANGE THE PASSWORD. This is the shipped default and the console warns on every startup
        # until it is something else.
        #
        # Remove BOTH lines to run without authentication - the console then warns about that on
        # every startup instead. Setting one without the other is a startup failure, not a guess.
        #
        # Basic auth sends these on every request, base64-encoded and not encrypted: terminate TLS
        # in front of the console, or keep it on an internal network.
        user = admin
        password = admin

        # Uncomment to refuse to start unless user/password are set, instead of warning.
        # auth-required = true

        # The Edit button on the Configs screens, which writes a node's config file and applies it.
        # Default true.
        #
        # It is forced OFF when no user/password is set above, whatever this says: an unauthenticated
        # console is readable by anyone who can reach the port, and must not also be a way to rewrite
        # the fleet's guard rules, bot classification and origin timeouts.
        #
        # Set it false for a read-only console - and note the node has the matching switch on its own
        # side, front-cache.management.config-write in frontcache.properties, which is the one to use
        # when conf/ is deployed from git or a container image.
        # config-editing = false
     }
     
}
