frontcache {
         
     console {
        urls = ["https://www.example.com:443/", "https://www123.example.com:443/"]
        apiKey = default-api-key

        # Edges that serve the same site behind a load balancer, grouped so that every circuit card
        # on a member's panel shows what the whole group is taking ("Cluster: 37.2/s") beside what
        # that node is taking ("Host: 17.5/s") - the traffic the SITE is taking, which was on the
        # realtime page once per node and summed nowhere.
        #
        # Without this a card carries only its own rate: the old "Cluster:" line was the same number
        # as "Host:", because a node's frame reports one host. The page keeps its shape either way -
        # one panel per edge, no extra panel.
        #
        # Group only interchangeable peers. In a
        #     load balancer -> (fc-edge, fc-eu, fc-ap) -> filter node -> app
        # topology the three regional nodes are one cluster and the filter node is not in it: its
        # traffic is the other three's, so adding it would count every request twice.
        #
        # Members are matched by URL - with or without the trailing slash - and an edge may be in at
        # most one cluster. A member not in 'urls' above, or claimed by two clusters, is warned about
        # on startup rather than being a startup failure; a cluster left with one member is rendered
        # as a plain edge. See docs/circuit-cluster-proposal.md.
        #
        # clusters {
        #     "Edge layer" = ["https://www.example.com:443/", "https://www123.example.com:443/"]
        # }

        # The console's single login (one user, no roles). The console can invalidate the cache of
        # every node listed above and holds the api-key that authorizes it, so leaving these out
        # makes it a credentialed proxy in front of an authenticated fleet.
        #
        # CHANGE THE PASSWORD. This is the shipped default and the console warns on every startup
        # until it is something else.
        #
        # Remove BOTH lines to run without authentication - the console then warns about that on
        # every startup instead. Setting one without the other is a startup failure, not a guess.
        #
        # A browser signs in on the console's own login page and carries a session cookie
        # afterwards. Everything else - curl, the container healthcheck, an existing script - keeps
        # sending these as HTTP Basic on every request, base64-encoded and not encrypted: terminate
        # TLS in front of the console, or keep it on an internal network.
        user = admin
        password = admin

        # Uncomment to refuse to start unless user/password are set, instead of warning.
        # auth-required = true

        # Adds Secure to the session cookie, so the browser only ever sends it over HTTPS.
        #
        # It has to be said here rather than detected: the attribute is set once when the webapp
        # starts, while whether the BROWSER used HTTPS is a per-request fact (X-Forwarded-Proto) on
        # exactly the deployments careful enough to terminate TLS in front. Turn it on when the
        # console is reached over https, including through a reverse proxy.
        #
        # Default false, because a console reached over plain http with this on would accept the
        # password and come straight back to the login page - the cookie would never be sent.
        # session-cookie-secure = true

        # The Edit button on the Configs screens, which writes a node's config file and applies it.
        # Default true.
        #
        # It is forced OFF when no user/password is set above, whatever this says: an unauthenticated
        # console is readable by anyone who can reach the port, and must not also be a way to rewrite
        # the fleet's guard rules, bot classification and origin timeouts.
        #
        # Set it false for a read-only console - and note the node has the matching switch on its own
        # side, front-cache.management.config-write in frontcache.properties, which is the one to use
        # when conf/ is deployed from git or a container image.
        # config-editing = false
     }
     
}
