# The e2e console (:frontcache-tests:consoleJetty, :7090) - the Community console, pointed at the two e2e
# nodes. CommunityEditionTests signs in with these credentials over Basic and checks that no Pro screen
# is rendered. frontcache-pro-tests runs the same console with the Pro plugin, from its own copy of this
# file.
frontcache {
    console {
        urls = ["http://localhost:9080/", "http://localhost:8080/"]
        apiKey = test-api-key-localhost
        user = e2e
        password = e2e-console-password
        # the e2e console is plain HTTP
        session-cookie-secure = false
    }
}
