############# FrontCache Configuration ###################

# front-cache.http-port and front-cache.https-port are important to handle redirects
# default front-cache.http-port=80
front-cache.http-port=8080
# default front-cache.https-port=443
front-cache.https-port=8443


############ Origin configs #################
# In FILTER MODE these are the app's OWN http address. An ordinary request reaches the app through
# the filter chain and never consults them - but a soft invalidation/refresh runs on a pool thread
# after the request is over, when the chain can no longer be used, so it drops the chain and fetches
# this address over HTTP. That is the whole of what they are for there, and it is why they are not
# optional: get them wrong and soft-expired entries silently stop refreshing.
# front-cache.origin-host defaults to "localhost", which is usually right in filter mode.
#
# In STANDALONE mode they are the origin, used by everything - including, since 2.9, cache-missing
# <fc:include> fetches (front-cache.include-fetch-target).

#front-cache.default-domain=default-domain
# Deliberately a DIFFERENT spelling of this same host from the one the tests request (localhost).
# Both resolve to the same Jetty, so the topology is unchanged - but the origin-facing URL and the
# public URL are now distinct strings, which is the only way the filter node can show whether an
# include was fetched from the origin and whether anything cached it under the wrong key. With both
# spelled "localhost" the two URLs coincide and a split cache key is invisible: that is how the
# defect fixed by isLoopbackOriginFetch passed a full e2e run. Needs no /etc/hosts entry.
front-cache.origin-host=127.0.0.1
front-cache.site-key=test-site-key-localhost
# default front-cache.origin-http-port=80 
front-cache.origin-http-port=8080
# default front-cache.origin-https-port=443 
front-cache.origin-https-port=8443

############# Cache Processor ###################

front-cache.cache-processor.impl=org.frontcache.cache.impl.L1L2CacheProcessor

############# Include Processor ###################
# the section is to configure 'page fragment includes' processing implementation 

#----- start Concurrent Include Processor configs -----
front-cache.include-processor.impl=org.frontcache.include.impl.ConcurrentIncludeProcessor

# amount of threads. default is 1
#front-cache.include-processor.impl.concurrent.thread-amount=10

# timeout in ms. default is 5000 (5 sec)
#front-cache.include-processor.impl.concurrent.timeout=3000

#----- end Concurrent Include Processor configs -----

# log requests/includes performance stat to HTTP headers. default is false
front-cache.log-to-headers=true
