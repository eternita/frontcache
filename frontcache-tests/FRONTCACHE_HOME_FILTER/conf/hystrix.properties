# DELIBERATELY still named hystrix.properties, with the pre-2.7 hystrix.* key prefix.
#
# The standalone e2e node uses conf/resilience.properties with resilience.* keys; this one is the
# other half of that pair, so the suite covers BOTH the legacy file name and the legacy key prefix
# end to end rather than only in unit tests. FallbackAndTimeoutTests runs against both nodes and asserts
# the per-command timeouts configured below, which is what makes this file load-bearing: if the
# back-compat lookup regressed, the filter-mode timeout tests would fail while standalone stayed green.
#
# Do not "fix" this file name. See docs/archive/hystrix-to-resilience4j-proposal.md section 8.
#
# Should an overdue command be interrupted?
# default: true
hystrix.command.default.execution.isolation.thread.interruptOnTimeout=true

# How many errors are allowed before the circuit breaker is activated?
# default: 50 (must be greater than 0,
# 100 means no breaking despite of errors)
hystrix.command.default.circuitBreaker.errorThresholdPercentage=50

# How many requests are needed in the time span to trigger the circuit breaker?
# default: 20
hystrix.command.default.circuitBreaker.requestVolumeThreshold=20

# After what time (in ms) should the circuit breaker try a single request?
# default: 5000
hystrix.command.default.circuitBreaker.sleepWindowInMilliseconds=5000

#hystrix.command.default.execution.isolation.strategy=SEMAPHORE
#hystrix.command.default.execution.timeout.enabled=true
#hystrix.command.default.execution.isolation.thread.timeoutInMilliseconds=10000

hystrix.command.Input-Requests.execution.isolation.strategy=SEMAPHORE
hystrix.command.Input-Requests.execution.isolation.thread.timeoutInMilliseconds=10000

hystrix.command.Origin-Hits.execution.isolation.strategy=THREAD
hystrix.command.Origin-Hits.execution.isolation.thread.timeoutInMilliseconds=5000

hystrix.command.Cache-Origin-http.execution.isolation.strategy=THREAD
hystrix.command.Cache-Origin-http.execution.isolation.thread.timeoutInMilliseconds=5000

hystrix.command.Cache-Origin-filter.execution.isolation.strategy=THREAD
hystrix.command.Cache-Origin-filter.execution.isolation.thread.timeoutInMilliseconds=5000

hystrix.command.Cache-Hits.execution.isolation.strategy=SEMAPHORE
hystrix.command.Cache-Hits.execution.isolation.thread.timeoutInMilliseconds=500
