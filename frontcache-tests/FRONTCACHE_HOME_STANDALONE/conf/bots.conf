# Conf for bots/crawlers - see docs/archive/dynamic-bots-classification-proposal.md
#
# The STANDALONE e2e node deliberately uses the 2.9.0 rule format alongside bare keywords, so the
# suite exercises the parser, the predicates and the hit counters end to end. Its FILTER counterpart
# is deliberately left on the bare-keyword-only format, so the suite also fails if reading a
# pre-2.9.0 file ever regresses. Do not "make them consistent".

# name          | condition                                    | client type
headless-e2e    | ua~(?i)(headlesschrome|phantomjs)            | bot
localhost-guest | client-ip:127.0.0.1,::1 ; ua~(?i)fc-e2e-guest | guest
never-fires-e2e | ua~(?i)fc-e2e-dry-run                        | bot | dry-run

# bare User-Agent keywords - matched case-insensitively as of 2.9.0
Googlebot
msnbot
bingbot
YandexBot
YandexDirect
Baiduspider
Yahoo! Slurp
majestic12
Mail.RU_Bot
EasouSpider
voilabot
AhrefsBot
orangebot
SemrushBot