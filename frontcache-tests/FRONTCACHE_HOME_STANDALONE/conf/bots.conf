# Conf for bots/crawlers
#
# The STANDALONE e2e node deliberately uses the 2.9.0 rule format alongside bare keywords, so the
# suite exercises the parser, the predicates and the hit counters end to end. Its FILTER counterpart
# is deliberately left on the bare-keyword-only format, so the suite also fails if reading a
# pre-2.9.0 file ever regresses. Do not "make them consistent".

# name          | condition                                    | client type
headless-e2e    | ua~(?i)(headlesschrome|phantomjs)            | bot
localhost-guest | client-ip:127.0.0.1,::1 ; ua~(?i)fc-e2e-guest | guest
never-fires-e2e | ua~(?i)fc-e2e-dry-run                        | bot | dry-run

# Visitor types (2.13.0) - StandaloneVisitorTypeTests. The rules name the types BEFORE the @type lines
# declare them, on purpose: declarations are read in a first pass, and the suite fails if that regresses.
# The FILTER node declares none, so the include and the origin call it serves see plain guests and bots.
customer-e2e    | cookie:fc_e2e_customer ; request-type:toplevel | customer
monitor-e2e     | ua~(?i)fc-e2e-monitor                        | monitor-e2e
member-e2e      | cookie:fc_e2e_member ; request-type:toplevel   | member-e2e
@type customer    like guest   # a visitor carrying the e2e site's cookie
@type monitor-e2e like bot     # an uptime monitor
@type member-e2e  like guest no-store   # reads the guests' copy, never writes one

# bare User-Agent keywords - matched case-insensitively as of 2.9.0
Googlebot
msnbot
bingbot
YandexBot
