# Guard rules for the STANDALONE e2e node.
#
# Everything here is scoped to /common/rate-limit/, on purpose: the whole suite reaches this node
# from 127.0.0.1, so an unscoped rate rule would count every test in the run as one client and
# refuse the rest of the suite.

# The paths that must never be guarded - the same exemptions any real deployment needs.
ping-by-ip     | uri~^/fc-ping\.jsp$        | allow
mgmt-by-ip     | uri~^/frontcache-io        | allow
fc-metrics     | uri~^/fc-metrics$          | allow
fc-dashboard   | uri~^/fc-dashboard\.stream | allow
hystrix-stream | uri~^/hystrix\.stream      | allow

# 3 requests per 2-second slot, per client IP - exercised by StandaloneRateLimitTests.
# The window is short so the test can wait it out; the shape is the shipped one.
ratelimit-e2e  | uri~^/common/rate-limit/ ; rate:3/2s | reject:429 Too Many Requests

# Only a request carrying this node's front-cache.edge-token passes - exercised by
# StandaloneEdgeTokenTests. Scoped to /common/edge-only/ for the same reason as the rate rule: the
# suite reaches this node directly, as a client, so an unscoped rule would refuse all of it.
edge-only-e2e  | uri~^/common/edge-only/ ; !edge-token | reject:403 Reached directly
