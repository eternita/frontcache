# Guard rules for the STANDALONE e2e node.
#
# Everything here is scoped to /common/rate-limit/, on purpose: the whole suite reaches this node
# from 127.0.0.1, so an unscoped rate rule would count every test in the run as one client and
# refuse the rest of the suite.

# The paths that must never be guarded - the same exemptions any real deployment needs.
ping-by-ip     | uri~^/fc-ping\.jsp$        | allow
mgmt-by-ip     | uri~^/frontcache-io        | allow
fc-metrics     | uri~^/fc-metrics$          | allow
fc-dashboard   | uri~^/fc-dashboard\.stream | allow
hystrix-stream | uri~^/hystrix\.stream      | allow

# 3 requests per 2-second slot, per client IP - exercised by StandaloneRateLimitTests.
# The window is short so the test can wait it out; the shape is the shipped one.
ratelimit-e2e  | uri~^/common/rate-limit/ ; rate:3/2s | reject:429 Too Many Requests

# Only a request carrying this node's front-cache.edge-token passes - exercised by
# StandaloneEdgeTokenTests. Scoped to /common/edge-only/ for the same reason as the rate rule: the
# suite reaches this node directly, as a client, so an unscoped rule would refuse all of it.
edge-only-e2e  | uri~^/common/edge-only/ ; !edge-token | reject:403 Reached directly

# A challenge with no provider on this node (no plugin offers 'pow'): the first acts as a dry run - logged, served as
# if the rule were not there - and the second as its else action (StandaloneChallengeTests). A run with a challenge
# plugin on the class path (the node has a cookie secret) sends the visitor to the plugin's page instead.
challenge-e2e      | uri~^/common/challenge/a\.jsp      | challenge pow
challenge-else-e2e | uri~^/common/challenge/else\.jsp   | challenge pow else reject:429 No challenge here

# A live list under conf/lists/ - the kind a plugin replaces through PluginContext.writeList, and every rule naming it
# sees at once, with no reload. Nothing writes it in a Community run: a missing list is an empty one (a WARN at load),
# so /common/listed/ is served as usual. A run with a plugin managing the list puts addresses in it.
listed-e2e         | uri~^/common/listed/ ; client-ip:@lists/e2e-listed.txt | reject:403 Listed

# A honeypot (StandaloneHoneypotTests): a path no page links to visibly and robots.txt disallows, so whoever fetches it
# is a crawler that ignores robots.txt or a scanner. 'trap' makes the log line name the address the node resolved
# (honeypot-e2e#127.0.0.1), never the forgeable client-IP column; a plugin observing guard.matched (the Pro defence
# plugin, DefenceTests) puts the address on a list.
honeypot-e2e       | uri~^/common/honeypot/ | reject:404 Not Found | trap
