# Should an overdue command be interrupted?
# default: true
resilience.command.default.execution.isolation.thread.interruptOnTimeout=true

# How many errors are allowed before the circuit breaker is activated?
# default: 50 (must be greater than 0,
# 100 means no breaking despite of errors)
resilience.command.default.circuitBreaker.errorThresholdPercentage=50

# How many requests are needed in the time span to trigger the circuit breaker?
# default: 20
resilience.command.default.circuitBreaker.requestVolumeThreshold=20

# After what time (in ms) should the circuit breaker try a single request?
# default: 5000
resilience.command.default.circuitBreaker.sleepWindowInMilliseconds=5000

#resilience.command.default.execution.isolation.strategy=SEMAPHORE
#resilience.command.default.execution.timeout.enabled=true
#resilience.command.default.execution.isolation.thread.timeoutInMilliseconds=10000

# Post-2.9.0 command key names. The filter-mode node's resilience.properties deliberately keeps the
# OLD ones (and the legacy hystrix.* key prefix), so the pair covers both the current names and the
# rename inheritance end to end.
resilience.command.Input-Request.execution.isolation.strategy=SEMAPHORE
resilience.command.Input-Request.execution.isolation.thread.timeoutInMilliseconds=10000

resilience.command.Cache-Bypass.execution.isolation.strategy=THREAD
resilience.command.Cache-Bypass.execution.isolation.thread.timeoutInMilliseconds=5000

resilience.command.Cache-Miss.execution.isolation.strategy=THREAD
resilience.command.Cache-Miss.execution.isolation.thread.timeoutInMilliseconds=5000

resilience.command.Cache-Hit.execution.isolation.strategy=SEMAPHORE
resilience.command.Cache-Hit.execution.isolation.thread.timeoutInMilliseconds=500
