# The crawler feeder - keeps conf/lists/googlebot.txt and conf/lists/bingbot.txt current from the vendors' published
# address ranges, through the node's scheduler and writeList. Background work and management actions only (manage):
# the core's client-ip:@lists/<name>.txt rule decides, never the plugin.
# A .properties file has no trailing comments: everything after '=' is the value.
id = crawler-feeder
class = org.frontcache.examples.crawlerfeeder.CrawlerFeederPlugin
name = Verified crawler feeder
version = 0.1.0
vendor = Eternita
license = Apache-2.0
plugin-api = 1
kinds = manage
config = crawler-feeder.conf
