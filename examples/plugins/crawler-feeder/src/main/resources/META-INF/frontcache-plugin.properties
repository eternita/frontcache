# The crawler feeder - keeps conf/lists/googlebot.txt, bingbot.txt and applebot.txt current from the vendors' published
# address ranges, and adds the claimants a guard rule reports once their reverse DNS confirms them (observe: guard.matched,
# checked on a thread of its own), through the node's scheduler and writeList (manage). The core's
# client-ip:@lists/<name>.txt rule decides, never the plugin.
# A .properties file has no trailing comments: everything after '=' is the value.
id = crawler-feeder
class = org.frontcache.examples.crawlerfeeder.CrawlerFeederPlugin
name = Verified crawler feeder
version = 0.1.0
vendor = Eternita
license = Apache-2.0
plugin-api = 1
kinds = observe, manage
config = crawler-feeder.conf
