# The debug plugin - GET /fc-x/debug/ shows how the node sees your request and what the guard recently decided
# about your address. Serves a page of its own (serve) and reads the guard's events (observe); decides nothing.
# A .properties file has no trailing comments: everything after '=' is the value.
id = debug
class = org.frontcache.examples.debug.DebugPlugin
name = Frontcache edge debugging
version = 0.1.0
vendor = Eternita
license = Apache-2.0
plugin-api = 1
kinds = serve, observe
config = debug.conf
