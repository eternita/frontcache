############# FrontCache Configuration ###################
front-cache.http-port=8080
front-cache.https-port=8443

############ Origin configs #################
front-cache.api-key=default-api-key
front-cache.origin-http-port=8080
front-cache.origin-https-port=8443

# log requests/includes performance stat to HTTP headers. default is false
front-cache.log-to-headers=true


############ Guard rules ####################
# Rules live in conf/guard-rules.conf (ships with everything commented out).
# Both keys below are read at STARTUP; the rules file itself reloads without a restart.

# Every host an absolute redirect target may point at, comma-separated. Nothing is allowed
# implicitly - not even your own site - so a redirect rule is refused at load without this.
#front-cache.guard-rules.allowed-redirect-hosts=www.example.com

# Required before any rate: rule means anything, whenever something proxies to Frontcache
# (nginx, a CDN, another Frontcache). Without it the limiter keys on the proxy's address and
# every visitor counts as one client. See docs/guard-getting-started.md section 5.1.
#front-cache.client-ip.trusted-proxies=127.0.0.1/32,::1/128,10.0.0.0/8
#front-cache.client-ip.header=X-Forwarded-For
