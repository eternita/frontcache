# Guard rules - checks that run BEFORE cache and origin, for every request.
#
# Getting started, recipes and troubleshooting: docs/guard-getting-started.md
# Per-IP rate limiting:                         docs/guard-getting-started.md section 5
#
# This file is OPTIONAL and everything in it is commented out, so nothing changes until you
# decide it should. The two built-in rules (below) are active with or without this file.
# Guard rules behave identically in filter mode (this example) and in the standalone proxy.
#
# FORMAT
#   <name> | <predicate> ; <predicate> ... | <action> [| dry-run]
#
#   name       short slug. It is written to frontcache-failed-requests.log as the reason and
#              becomes the metric in the Kibana "Frontcache Rejected Requests" dashboard, so
#              renaming a rule renames the metric.
#   predicate  AND-ed, ';'-separated. Prefix with '!' to negate:
#                host:ip                 Host is an IP literal (v4/v6), not a name
#                host~<regex>            server name
#                uri~<regex>             request URI (no query string)
#                query~<regex>           query string (leading '?' included)
#                url~<regex>             scheme + host + URI + query
#                method:<GET|POST|...>   HTTP method
#                client-type:<bot|browser>   from bots.conf
#                cookie:<name>           cookie present (presence only - values are never read)
#                header:<name>[~<regex>] header present / matching
#                request-type:<toplevel|include|include-async>
#                                        toplevel = a request from a client; the others are
#                                        <fc:include> fragments re-entering the engine
#              Regexes are java.util.regex, matched with find() - same as dynamic-urls.conf,
#              so they are UNANCHORED: uri~/admin also matches /x/admin. Anchor with ^.
#
#              PER-IP RATE LIMIT (cannot be negated, and is always evaluated last):
#                rate:<limit>/<window> [bucket=<name>] [scope=<toplevel|all>]
#                  true once ONE client IP has sent <limit> requests inside the current <window>,
#                  and for every further request until the window rolls over.
#                  <window> is <n>s / <n>m / <n>h; a bare unit means 1, so /s is /1s. Max 1h.
#                  rate:100/10s = 100 requests per 10-second slot, per IP.
#                  bucket=  share one counter between rules. Defaults to the RULE NAME, so a
#                           dry-run copy of a rule measures a different limit without disturbing
#                           the live one.
#                  scope=   toplevel (default) counts only client requests. An <fc:include>
#                           carries the original visitor's address, so counting includes would
#                           spend a visitor's budget once per fragment of their page.
#                  The counter is per NODE and in memory: behind N edges a limit of 100 is a fleet
#                  limit of about 100*N. It resets on restart, survives reload-guard-rules.
#                  REQUIRES front-cache.client-ip.trusted-proxies when anything proxies to
#                  Frontcache (nginx, a CDN, another Frontcache) - without it every visitor keys
#                  on the proxy's address and your whole site counts as one client. See
#                  frontcache.properties and docs/guard-getting-started.md section 5.1.
#   action     allow                     stop evaluating, let the request through (exemption)
#              reject:<4xx|5xx> [body]   send status + short text/plain body
#              redirect:<301|302|303|307|308> <target>
#                                        Location + Cache-Control: no-store.
#                                        Target may be relative ('/login.htm') or absolute; an
#                                        absolute host must be listed in
#                                        front-cache.guard-rules.allowed-redirect-hosts - nothing
#                                        is allowed implicitly, not even your own site.
#                                        Placeholders: ${uri} ${query} ${url} ${url:enc} ${host}
#   dry-run    evaluate and log only - the request is untouched. ALWAYS ship a new rule this way
#              first and watch what it would have caught before letting it act.
#
# ORDER
#   Rules run top to bottom, FIRST MATCH WINS, after the two built-ins (uri-too-long -> 414,
#   bad-request -> 400). Exemptions are 'allow' rules placed ABOVE the rule they exempt from.
#
# SAFETY
#   A rule that fails to parse - bad regex, unknown predicate, redirect to an unlisted host, a
#   redirect target its own condition matches (infinite loop) - is skipped with an ERROR in the
#   log; the other rules keep working. Frontcache also WARNs at startup if a rule would block
#   /fc-ping.jsp (load-balancer health check), /frontcache-io (agent, console, replication) or
#   /fc-dashboard.stream and its pre-2.7 alias /hystrix.stream (console metrics).
#
# Reload after editing: restart, or call the management servlet (this example serves on 8080):
#   curl -H "Authorization: Bearer default-api-key" \
#        "http://localhost:8080/frontcache-io?action=reload-guard-rules"
# Inspect what the node is running, with per-rule hit counts:
#   curl -H "Authorization: Bearer default-api-key" \
#        "http://localhost:8080/frontcache-io?action=get-guard-rules"
# ...or open the console's "Guard Rules" screen, which shows the same per edge.
#
# Everything below is commented out: no configured rules ship enabled by default.


# --- exemptions: keep these ABOVE any rule that could match them --------------------------
# Your own infrastructure addresses the node by IP and must keep working.
#ping-by-ip     | uri~^/fc-ping\.jsp$        | allow
#mgmt-by-ip     | uri~^/frontcache-io        | allow
#fc-metrics     | uri~^/fc-metrics$          | allow
#fc-dashboard   | uri~^/fc-dashboard\.stream | allow
#hystrix-stream | uri~^/hystrix\.stream      | allow
#login-page     | uri~^/login\.htm           | allow

# --- scanners hitting the node by IP instead of by name -----------------------------------
# Saves the cache lookup and origin call for traffic that is never a real visitor.
# The absolute target's host must be in front-cache.guard-rules.allowed-redirect-hosts.
#ip-access      | host:ip                    | redirect:301 https://www.example.com/welcome.htm

# --- anonymous visitors on account-only pages ---------------------------------------------
# No session cookie -> the origin would render a page whose only outcome is "go log in".
# 302 (not 301): the decision depends on a cookie and must be re-made on every visit.
# Note the login-page exemption above - without it this rule redirects to itself, forever.
#anon-account   | uri~^/account/ ; !cookie:JSESSIONID | redirect:302 https://www.example.com/login.htm?return=${url:enc}

# --- per-IP rate limits -------------------------------------------------------------------
# ALWAYS ship these dry-run first and read what they would have caught before letting them
# act: it tells you how many REAL visitors the limit would have refused, and (from the log's
# reason column, '<rule>#<address>') which addresses they were.
#
# Sizing: a limit of 100 per 10s is 10 req/s sustained, but it also permits all 100 in the
# first 200ms of the slot. If a client that bursts hard but averages low should NOT pass,
# shorten the window rather than lowering the limit - 20/2s is the same average rate with a
# tenth of the burst tolerance. Remember one page view is often several requests.

# blanket brake: catches scrapers and scanners, not visitors
#ip-flood       | rate:100/10s               | reject:429 Too Many Requests | dry-run

# tighter, on the expensive uncacheable path only
#search-flood   | uri~^/search ; rate:20/10s | reject:429 Too Many Requests | dry-run

# credential stuffing - note the counter is only fed by POSTs to that one page
#login-flood    | uri~^/login\.htm$ ; method:POST ; rate:10/1m | reject:429 Slow down | dry-run

# a misbehaving crawler gets slowed, not blocked; browsers never touch the counter
#bot-flood      | client-type:bot ; rate:100/10s | reject:429 Crawl slower | dry-run
