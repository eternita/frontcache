############# FrontCache Configuration ###################
# The CLIENT-FACING ports; they are what redirect rewriting uses. This example serves
# directly on 8080 (see the appRun task), so they are 8080/8443 - not 9080, which is the
# standalone SERVER's default and was wrong here.
front-cache.http-port=8080
front-cache.https-port=8443

############ Origin configs #################
front-cache.site-key=default-site-key
front-cache.origin-http-port=80
front-cache.origin-https-port=443

# log requests/includes performance stat to HTTP headers. default is false
front-cache.log-to-headers=true

