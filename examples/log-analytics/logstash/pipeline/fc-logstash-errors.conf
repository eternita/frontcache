# Parse Frontcache error logs pulled into /var/log/fc by ./pull-logs.sh.
#
# Line format (logback: %d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n):
#   HH:mm:ss.SSS [thread] LEVEL logger - message
#
# Notes:
#  - Each ERROR entry is multi-line (header line + exception stack trace); a
#    multiline codec (below) joins them so one error = one document.
#  - The logback pattern only includes time (no date). The date comes from the
#    filename for rolled archives (error-YYYY-MM-dd.log), or the ingest date for
#    the current day's error.log, combined with the line time for @timestamp.
#  - `server` is derived from the host-alias filename prefix (pull-logs.sh).
input {
    file {
        # pull-logs.sh drops <host>-error*.log here
        path => "/var/log/fc/*error*.log"
        start_position => "beginning"
        sincedb_path => "/usr/share/logstash/data/fc_errors_sincedb"
        # exclude request log files that happen to match *error*
        exclude => ["*frontcache-requests*", "*failed-requests*"]
        # ERROR entries span multiple lines: the "HH:mm:ss.SSS [thread] LEVEL ..."
        # header line is followed by the exception's stack trace ("\tat ...",
        # "Caused by: ...", etc.). Join every line that does NOT start with a
        # timestamp onto the previous event so one error = one document (with the
        # full stack trace in `msg`) instead of one doc per stack-trace line.
        codec => multiline {
            pattern => "^\d{2}:\d{2}:\d{2}[.,]\d{3} "
            negate => true
            what => "previous"
            auto_flush_interval => 5
        }
    }
}

filter {
    grok {
        # (?m:.*) so `msg` captures the whole multiline message incl. stack trace
        # (in Ruby/Oniguruma regex `m` is the dot-matches-newline flag, not `s`).
        match => { "message" => "%{TIME:log_time} \[%{DATA:thread}\] %{LOGLEVEL:log_level} %{DATA:logger} - (?<msg>(?m:.*))" }
    }

    # Extract date from the filename (rolled files: *-error-YYYY-MM-dd.log).
    # Current day's file (e.g. fc-us-error.log) has no date in the name; the
    # date filter falls back to time-only parsing in that case.
    grok {
        match => { "[log][file][path]" => ".*[/-](?:[^-]+-)?error-(?<log_date>\d{4}-\d{2}-\d{2})\.log" }
        tag_on_failure => []
    }

    # The error log line has no FC node identity (logback pattern is time/thread/
    # level/logger/msg only). pull-logs.sh prefixes each file with the host alias
    # (<host>-error.log / <host>-error-YYYY-MM-dd.log), so derive `server` from the
    # filename — this feeds the "Errors by FC node" dashboard panels.
    grok {
        match => { "[log][file][path]" => "/(?<server>[^/]+?)-error(?:-\d{4}-\d{2}-\d{2})?\.log$" }
        tag_on_failure => []
    }

    # Combine date from filename + time from the log line when both are available.
    if [log_date] and [log_time] {
        mutate { add_field => { "log_datetime" => "%{log_date}T%{log_time}" } }
        date {
            # logback writes HH:mm:ss.SSS (dot); accept comma too for safety.
            match => ["log_datetime", "yyyy-MM-dd'T'HH:mm:ss.SSS", "yyyy-MM-dd'T'HH:mm:ss,SSS"]
            target => "@timestamp"
        }
        mutate { remove_field => ["log_datetime", "log_date"] }
    } else if [log_time] {
        # No date in filename (current day's log, e.g. error.log): the log line
        # carries only a time. Parsing time alone would default the date to
        # Jan 1, so combine the line's time with the ingest date (@timestamp is
        # the file read time here — same day the current log is pulled).
        ruby {
            code => 'event.set("log_date", event.get("@timestamp").time.strftime("%Y-%m-%d"))'
        }
        mutate { add_field => { "log_datetime" => "%{log_date}T%{log_time}" } }
        date {
            match => ["log_datetime", "yyyy-MM-dd'T'HH:mm:ss.SSS", "yyyy-MM-dd'T'HH:mm:ss,SSS"]
            target => "@timestamp"
        }
        mutate { remove_field => ["log_datetime", "log_date"] }
    }
    mutate { remove_field => ["log_time"] }

    # Try to extract an exception class: the first fully-qualified class name
    # ending in Exception/Error/Throwable found anywhere in the message or its
    # stack trace (the msg may start with descriptive text before the class).
    grok {
        match => { "msg" => "(?<exception_class>[a-zA-Z][a-zA-Z0-9_.]*(?:Exception|Error|Throwable))" }
        tag_on_failure => []
    }

    # Try to extract a URL from the message (quoted or after " - " / "FOR ").
    grok {
        match => { "msg" => "\"(?<error_url>https?://[^\"]+)\"" }
        tag_on_failure => []
    }
    if ![error_url] {
        grok {
            match => { "msg" => "(?:FOR|ERROR)\s+-\s+(?<error_url>https?://\S+)" }
            tag_on_failure => []
        }
    }
}

output {
    # stdout { codec => rubydebug }   # uncomment to debug parsing
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "frontcache-errors-%{+YYYY.MM.dd}"
        manage_template => false
    }
}
