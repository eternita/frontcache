# Parse Frontcache fallback logs pulled into /var/log/fc by ./pull-logs.sh.
#
# Line format (pipe-separated, written by FallbackLogger / DefaultFallbackResolver /
# FileBasedFallbackResolver):
#   <timestamp> | <fallbackSource> | <resolution-status> | <details> | <url>
#
# Timestamp: yyyy-MM-dd'T'HH:mm:ss,SSSZ  (e.g. 2026-07-18T14:23:45,123+0000)
# Resolution status: "default" | "from file"
# Whitespace around "|" separators may vary.
input {
    file {
        # pull-logs.sh drops <host>-fallback*.log here
        path => "/var/log/fc/*fallback*.log"
        start_position => "beginning"
        sincedb_path => "/usr/share/logstash/data/fc_fallbacks_sincedb"
    }
}

filter {
    grok {
        match => { "message" => "%{TIMESTAMP_ISO8601:logTimestampString}\s*\|\s*%{DATA:fallback_source}\s*\|\s*%{DATA:fallback_status}\s*\|\s*%{DATA:fallback_details}\s*\|\s*%{GREEDYDATA:fallback_url}" }
    }

    date {
        match => ["logTimestampString", "ISO8601"]
        target => "@timestamp"
    }

    mutate {
        strip => ["fallback_source", "fallback_status", "fallback_details", "fallback_url"]
    }
}

output {
    # stdout { codec => rubydebug }   # uncomment to debug parsing
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "frontcache-fallbacks-%{+YYYY.MM.dd}"
        manage_template => false
    }
}
