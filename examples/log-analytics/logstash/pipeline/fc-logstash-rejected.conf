# Parse Frontcache rejected/failed request logs pulled into /var/log/fc by ./pull-logs.sh.
#
# Source file: frontcache-failed-requests*.log (logback appender
# "FailedRequestLoggerFile", logger "frontcache.failed-requests").
#
# It carries the SAME columns as the request log plus a trailing quoted reason, and holds two
# families of lines (see org.frontcache.reqlog.RequestLogger):
#
#  1. GUARD ACTIONS - a rule in org.frontcache.guard matched before cache/origin
#     (FrontCacheEngine.applyGuardAction -> RequestLogger.logGuardedRequest). The reason is the
#     RULE NAME, and the HTTP status sent follows as an extra trailing column. The is_cached
#     column says what the rule did:
#       "rejected"   - reject action, e.g. built-in bad-request (400) / uri-too-long (414)
#       "redirected" - redirect action, e.g. ip-access (301) / anon-analytics (302)
#       "dry-run"    - rule matched but only observed; nothing was sent, so status is 0 and the
#                      reason carries a ":dry-run" suffix
#  2. HYSTRIX FALLBACKS - the request completed but fell back
#     (RequestLogger.logRequest when context.isHystrixFallback()):
#     reason = "short-circuited" | "timeout" | "rejected" | "failure" | "error", no status column
#
# Line format (<status> on guard-action lines only, hence optional in the grok below):
#   <ts> <request_id> <domain> <method> <hystrix_error> <type> <cacheable> <cached> \
#   <runtime_millis> <length_bytes> "<url>" "<clientip>" <server> <browserBot> "<agent>" \
#   "<reason>" [<status>]
#
# `failure_type` carries the family into Elasticsearch so the dashboard can slice either way:
#   "rejected" | "redirected" | "dry-run" | "hystrix-fallback".
input {
    file {
        # pull-logs.sh drops <host>-frontcache-failed-requests*.log here
        path => "/var/log/fc/*frontcache-failed-requests*.log"
        start_position => "beginning"
        sincedb_path => "/usr/share/logstash/data/fc_rejected_sincedb"
    }
}

filter {
    # health-check pings are noise
    if [message] =~ /fc-ping.jsp/ {
        drop {}
    }

    # url, clientip, agent and reason are quoted in the log (RequestLogger); capture
    # the inner value with literal quotes so the fields are clean (no surrounding ").
    # http_status is the last column and only present on up-front rejections, so it is
    # matched by an optional group - hystrix-fallback lines simply leave it unset. It is
    # kept as a string (mapped keyword) because a status code is a category, not a quantity.
    grok {
        match => { "message" => "%{TIMESTAMP_ISO8601:logTimestampString} %{NOTSPACE:request_id} %{NOTSPACE:domain} %{NOTSPACE:request_method} %{NOTSPACE:hystrix_error} %{NOTSPACE:request_type} %{NOTSPACE:is_cacheable} %{NOTSPACE:is_cached} %{NUMBER:runtime_millis:int} %{NUMBER:length_bytes:int} \"%{DATA:url}\" \"%{DATA:clientip_raw}\" %{NOTSPACE:server} %{NOTSPACE:browserBot} \"%{DATA:agent}\" \"%{DATA:reject_reason}\"(?: %{NUMBER:http_status})?" }
    }

    # guard action (reject / redirect / dry-run) vs degraded (hystrix fallback) response.
    # The disposition is written by RequestLogger into the is_cached column; anything else is a
    # request that completed through a fallback, where is_cached holds a real cache state
    # (from-cache / dynamic / dynamic-soft).
    if [is_cached] == "rejected" {
        mutate { add_field => { "failure_type" => "rejected" } }
    } else if [is_cached] == "redirected" {
        mutate { add_field => { "failure_type" => "redirected" } }
    } else if [is_cached] == "dry-run" {
        mutate { add_field => { "failure_type" => "dry-run" } }
    } else {
        mutate { add_field => { "failure_type" => "hystrix-fallback" } }
    }

    # a dry-run rule sends nothing, so its logged status is a placeholder 0 - drop it rather than
    # let "0" show up as an HTTP status in the dashboard
    if [http_status] == "0" {
        mutate { remove_field => ["http_status"] }
    }

    date {
        match => ["logTimestampString", "ISO8601"]
        target => "@timestamp"
    }

    # clientip may be an X-Forwarded-For list ("client, proxy1, ...") or a literal
    # like "unresolved". Keep the first token as the client IP; if it isn't an IP
    # (e.g. "unresolved") just leave clientip unset — geoip then no-ops.
    grok {
        match => { "clientip_raw" => "^%{IP:clientip}" }
        tag_on_failure => []
    }
    mutate { remove_field => ["clientip_raw"] }

    # Logstash 8 ships a bundled GeoLite2-City DB; no `database =>` needed.
    # ecs_compatibility=>disabled keeps the legacy flat layout: geoip.location
    # (geo_point, mapped by the index template), geoip.country_name, geoip.city_name, ...
    geoip {
        source => "clientip"
        target => "geoip"
        ecs_compatibility => "disabled"
    }
}

output {
    # stdout { codec => rubydebug }   # uncomment to debug parsing
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "frontcache-rejected-%{+YYYY.MM.dd}"
        # Mappings (incl. geoip.location as geo_point) come from the composable
        # index template applied by start-fc-elk.sh; don't let Logstash manage its own.
        manage_template => false
    }
}
