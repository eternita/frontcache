# Parse Frontcache request logs pulled into /var/log/fc by ./pull-logs.sh.
#
# Line format (see org.frontcache.reqlog.RequestLogger):
#   <ts> <request_id> <domain> <method> <hystrix_error> <type> <cacheable> <cached> \
#   <runtime_millis> <length_bytes> "<url>" "<clientip>" <server> <browserBot> \
#   "<client_type_rule>" "<agent>"
#
# <client_type_rule> is the conf/bots.conf rule that decided <browserBot> - a rule name, a bare
# keyword line (which may contain a space, hence the quotes: "Yahoo! Slurp"), the built-in
# "no-user-agent" / "default", "propagated" (client type adopted from a trusted peer) or "-".
# It was INSERTED after the client type in Frontcache 2.10.0, not appended, so the user agent
# moved right by one - see docs/release-notes-2.10.0.md. Both layouts are parsed below.
input {
    file {
        # pull-logs.sh drops <host>-frontcache-requests*.log here
        path => "/var/log/fc/*frontcache-requests*.log"
        start_position => "beginning"
        # sincedb lives under the persisted data volume so restarts don't re-ingest
        sincedb_path => "/usr/share/logstash/data/fc_sincedb"
    }
}

filter {
    # health-check pings are noise
    if [message] =~ /fc-ping.jsp/ {
        drop {}
    }

    # url, clientip, client_type_rule and agent are quoted in the log (RequestLogger); capture
    # the inner value with literal quotes so the fields are clean (no surrounding ").
    #
    # TWO patterns, tried in order: 2.10.0 and later first, then the pre-2.10.0 layout that has
    # no client-type-rule column. Both are needed at once - pull-logs.sh ships rolled archives
    # written before the node upgrade, and the day of the upgrade holds both shapes. Order is
    # load-bearing: grok is unanchored, so the legacy pattern happily reads the rule column as
    # the user agent and would win every line if it came first. The reverse cannot happen - the
    # 2.10.0 pattern needs two quoted fields after the client type and a legacy line has one.
    # Pre-2.10.0 documents simply carry no client_type_rule field.
    grok {
        pattern_definitions => {
            # columns 1-14, which 2.7.0 pinned and 2.10.0 left alone: up to and incl. the client type
            "FC_REQLOG_HEAD" => "%{TIMESTAMP_ISO8601:logTimestampString} %{NOTSPACE:request_id} %{NOTSPACE:domain} %{NOTSPACE:request_method} %{NOTSPACE:hystrix_error} %{NOTSPACE:request_type} %{NOTSPACE:is_cacheable} %{NOTSPACE:is_cached} %{NUMBER:runtime_millis:int} %{NUMBER:length_bytes:int} \"%{DATA:url}\" \"%{DATA:clientip_raw}\" %{NOTSPACE:server} %{NOTSPACE:browserBot}"
        }
        match => { "message" => [
            "%{FC_REQLOG_HEAD} \"%{DATA:client_type_rule}\" \"%{DATA:agent}\"",
            "%{FC_REQLOG_HEAD} \"%{DATA:agent}\""
        ] }
    }

    date {
        match => ["logTimestampString", "ISO8601"]
        target => "@timestamp"
    }

    # clientip may be an X-Forwarded-For list ("client, proxy1, ...") or a literal
    # like "unresolved". Keep the first token as the client IP; if it isn't an IP
    # (e.g. "unresolved") just leave clientip unset — geoip then no-ops.
    grok {
        match => { "clientip_raw" => "^%{IP:clientip}" }
        tag_on_failure => []
    }
    mutate { remove_field => ["clientip_raw"] }

    # Logstash 8 ships a bundled GeoLite2-City DB; no `database =>` needed.
    # ecs_compatibility=>disabled keeps the legacy flat layout: geoip.location
    # (geo_point, mapped by the index template), geoip.country_name, geoip.city_name, ...
    # (ECS mode would nest the point at geoip.geo.location and break the map mapping.)
    geoip {
        source => "clientip"
        target => "geoip"
        ecs_compatibility => "disabled"
    }
}

output {
    # stdout { codec => rubydebug }   # uncomment to debug parsing
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "frontcache-%{+YYYY.MM.dd}"
        # Mappings (incl. geoip.location as geo_point) come from the composable
        # index template applied by start-fc-elk.sh; don't let Logstash manage its own.
        manage_template => false
    }
}
