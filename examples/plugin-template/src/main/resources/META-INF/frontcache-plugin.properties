# The plugin's manifest - how a node finds the plugin in its jar. Rename what you copy: id, class, name, vendor.
#
#   id         [a-z][a-z0-9-]{1,30} - the plugins/<id>/ directory, the /fc-x/<id>/ path, conf/<config>'s owner
#   class      the entry class, implementing org.frontcache.plugin.FrontcachePlugin (public no-argument constructor)
#   plugin-api the API major this was built against - 1
#   kinds      what it contributes, checked by the node: observe (E1), serve (E2), decide (E3), manage (E6)
#   config     optional: conf/<file>, HOCON, handed over parsed by the node
#
# A .properties file has NO trailing comments: everything after '=' is the value, so 'id = example  # x' is refused.
# Keep version equal to build.gradle's.
id = example
class = com.example.frontcache.ExamplePlugin
name = Example plugin
version = 0.1.0
vendor = Example
license = Apache-2.0
plugin-api = 1
kinds = observe, serve, decide
config = example.conf
