# A throwaway origin, so `docker compose up` works with nothing else installed. Replace the
# `origin` service with your own app - this exists to make the example runnable, not to be
# copied into production.
#
# Two things a real origin has to do are shown here:
#
#   1. Mark a page cacheable with x-frontcache-component-maxage. Without that header,
#      Frontcache proxies the page through and caches nothing. That header is the entire
#      contract between your app and Frontcache.
#   2. Serve the paths nginx sends straight to the origin (/images/ here), which never reach
#      Frontcache at all.
server {
    listen 80 default_server;
    server_name _;

    # a cached page: Frontcache stores it for an hour and serves later hits itself
    location = / {
        add_header x-frontcache-component-maxage "1h" always;
        add_header x-origin-served "yes" always;
        default_type text/html;
        return 200 '<html><body><h1>origin home</h1><p>cached by Frontcache for 1h</p></body></html>';
    }

    # NOT marked cacheable: Frontcache proxies it every time
    location = /dynamic {
        add_header x-origin-served "yes" always;
        default_type text/html;
        return 200 '<html><body><h1>dynamic</h1></body></html>';
    }

    # bypasses Frontcache entirely - nginx proxies this path straight here
    location /images/ {
        add_header x-origin-served "yes" always;
        default_type text/plain;
        return 200 'static asset straight from the origin';
    }
}
