<svg viewBox="0 0 880 262" width="880" height="262" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#475569"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="262" fill="#ffffff"/>

  <!-- entry modes -->
  <rect x="20" y="58" width="180" height="52" rx="6" fill="#e2e8f0" stroke="#475569"/>
  <text x="110" y="82" text-anchor="middle">FrontCache</text>
  <text x="110" y="100" text-anchor="middle" font-size="12" fill="#64748b">(filter mode)</text>

  <rect x="20" y="150" width="180" height="52" rx="6" fill="#e2e8f0" stroke="#475569"/>
  <text x="110" y="174" text-anchor="middle">FrontCache</text>
  <text x="110" y="192" text-anchor="middle" font-size="12" fill="#64748b">(standalone mode)</text>

  <!-- engine -->
  <rect x="300" y="24" width="300" height="212" rx="8" fill="#eef2ff" stroke="#4338ca"/>
  <text x="450" y="48" text-anchor="middle" font-weight="bold" fill="#4338ca">FrontCacheEngine (singleton)</text>

  <rect x="320" y="62" width="260" height="52" rx="6" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="450" y="84" text-anchor="middle">CacheProcessor</text>
  <text x="450" y="102" text-anchor="middle" font-size="12" fill="#4338ca">L1 Ehcache + L2 Lucene</text>

  <rect x="320" y="122" width="260" height="52" rx="6" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="450" y="144" text-anchor="middle">IncludeProcessor</text>
  <text x="450" y="162" text-anchor="middle" font-size="12" fill="#4338ca">resolves fc:include, concurrently</text>

  <rect x="320" y="182" width="260" height="52" rx="6" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="450" y="204" text-anchor="middle">Resilience commands</text>
  <text x="450" y="222" text-anchor="middle" font-size="12" fill="#4338ca">circuit breaker + FallbackResolver</text>

  <!-- origin -->
  <rect x="680" y="104" width="170" height="52" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="765" y="126" text-anchor="middle">Origin web app</text>
  <text x="765" y="144" text-anchor="middle" font-size="12" fill="#64748b">(any language)</text>

  <!-- edges -->
  <line x1="200" y1="84" x2="296" y2="108" stroke="#475569" marker-end="url(#a)"/>
  <line x1="200" y1="176" x2="296" y2="152" stroke="#475569" marker-end="url(#a)"/>
  <line x1="600" y1="130" x2="676" y2="130" stroke="#475569" marker-end="url(#a)"/>
  <text x="638" y="122" text-anchor="middle" font-size="12" fill="#64748b">on a miss</text>
</svg>
