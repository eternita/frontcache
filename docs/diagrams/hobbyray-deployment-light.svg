<svg viewBox="0 0 1040 886" width="1040" height="886" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>hobbyray.com Frontcache deployment — GSLB, three standalone edges, Java origin with FrontCacheFilter</title>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#475569"/></marker>

    <linearGradient id="gUsers" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eff6ff"/><stop offset="1" stop-color="#dbeafe"/></linearGradient>
    <linearGradient id="gGslb"  x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbeb"/><stop offset="1" stop-color="#fde68a"/></linearGradient>
    <linearGradient id="gUs"    x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
    <linearGradient id="gOrigin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff1f2"/><stop offset="1" stop-color="#fecdd3"/></linearGradient>
    <linearGradient id="gSolr"  x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f9ff"/><stop offset="1" stop-color="#bae6fd"/></linearGradient>
    <linearGradient id="gDb"    x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0fdf4"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient>
    <linearGradient id="gSvc"   x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#fed7aa"/></linearGradient>
  </defs>

  <rect x="0" y="0" width="1040" height="886" fill="#ffffff"/>

  <!-- ============ title ============ -->
  <text x="520" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">hobbyray.com — Frontcache deployment (multi-tier)</text>
  <text x="520" y="56" text-anchor="middle" font-size="13" fill="#64748b">GSLB → three standalone edges → Java origin with in-JVM Frontcache filter</text>

  <!-- ============ visitors ============ -->
  <rect x="250" y="76" width="540" height="60" rx="30" fill="url(#gUsers)" stroke="#2563eb" stroke-width="1.5"/>
  <g fill="#2563eb">
    <circle cx="286" cy="100" r="5.5"/><path d="M277,116 a9,9 0 0 1 18,0 z"/>
    <circle cx="304" cy="103" r="4.5"/><path d="M296.5,116 a7.5,7.5 0 0 1 15,0 z"/>
    <circle cx="320" cy="100" r="5.5"/><path d="M311,116 a9,9 0 0 1 18,0 z"/>
  </g>
  <text x="562" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">Visitors &amp; Search-engine crawlers &amp; AI agents</text>

  <line x1="520" y1="136" x2="520" y2="166" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ============ GSLB ============ -->
  <rect x="260" y="170" width="520" height="60" rx="14" fill="url(#gGslb)" stroke="#d97706" stroke-width="2"/>
  <g stroke="#b45309" stroke-width="1.6" fill="none">
    <circle cx="306" cy="200" r="20" fill="#fffbeb"/>
    <ellipse cx="306" cy="200" rx="9" ry="20"/>
    <line x1="286" y1="200" x2="326" y2="200"/>
    <path d="M290,188 Q306,195 322,188"/>
    <path d="M290,212 Q306,205 322,212"/>
  </g>
  <text x="545" y="197" text-anchor="middle" font-size="17" font-weight="bold" fill="#92400e">www.hobbyray.com</text>
  <text x="545" y="217" text-anchor="middle" font-size="13" fill="#78350f">Global Server Load Balancer</text>

  <line x1="440" y1="230" x2="200" y2="282" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="520" y1="230" x2="520" y2="282" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="640" y1="230" x2="860" y2="282" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="300" y="256" text-anchor="middle" font-size="11.5" fill="#64748b">nearest region</text>
  <text x="770" y="256" text-anchor="middle" font-size="11.5" fill="#64748b">nearest region</text>

  <!-- ============ edge node cards ============ -->
  <!-- US -->
  <rect x="30" y="284" width="290" height="158" rx="14" fill="url(#gUs)" stroke="#4338ca" stroke-width="2"/>
  <g fill="#4338ca"><rect x="46" y="298" width="30" height="9" rx="2"/><rect x="46" y="311" width="30" height="9" rx="2"/><rect x="46" y="324" width="30" height="9" rx="2"/></g>
  <g fill="#c7d2fe"><circle cx="51" cy="302.5" r="1.8"/><circle cx="51" cy="315.5" r="1.8"/><circle cx="51" cy="328.5" r="1.8"/></g>
  <text x="88" y="320" font-size="15" font-weight="bold" fill="#312e81">fc-us.hobbyray.com</text>
  <rect x="44" y="345" width="262" height="34" rx="8" fill="#ffffff" stroke="#4338ca"/>
  <text x="175" y="367" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">nginx :80 / :443</text>
  <rect x="44" y="391" width="262" height="34" rx="8" fill="#eef2ff" stroke="#4338ca"/>
  <text x="175" y="413" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Frontcache :9080</text>

  <!-- EU -->
  <rect x="375" y="284" width="290" height="158" rx="14" fill="url(#gUs)" stroke="#4338ca" stroke-width="2"/>
  <g fill="#4338ca"><rect x="391" y="298" width="30" height="9" rx="2"/><rect x="391" y="311" width="30" height="9" rx="2"/><rect x="391" y="324" width="30" height="9" rx="2"/></g>
  <g fill="#c7d2fe"><circle cx="396" cy="302.5" r="1.8"/><circle cx="396" cy="315.5" r="1.8"/><circle cx="396" cy="328.5" r="1.8"/></g>
  <text x="433" y="320" font-size="15" font-weight="bold" fill="#312e81">fc-eu.hobbyray.com</text>
  <rect x="389" y="345" width="262" height="34" rx="8" fill="#ffffff" stroke="#4338ca"/>
  <text x="520" y="367" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">nginx :80 / :443</text>
  <rect x="389" y="391" width="262" height="34" rx="8" fill="#eef2ff" stroke="#4338ca"/>
  <text x="520" y="413" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Frontcache :9080</text>

  <!-- AP -->
  <rect x="720" y="284" width="290" height="158" rx="14" fill="url(#gUs)" stroke="#4338ca" stroke-width="2"/>
  <g fill="#4338ca"><rect x="736" y="298" width="30" height="9" rx="2"/><rect x="736" y="311" width="30" height="9" rx="2"/><rect x="736" y="324" width="30" height="9" rx="2"/></g>
  <g fill="#c7d2fe"><circle cx="741" cy="302.5" r="1.8"/><circle cx="741" cy="315.5" r="1.8"/><circle cx="741" cy="328.5" r="1.8"/></g>
  <text x="778" y="320" font-size="15" font-weight="bold" fill="#312e81">fc-ap.hobbyray.com</text>
  <rect x="734" y="345" width="262" height="34" rx="8" fill="#ffffff" stroke="#4338ca"/>
  <text x="865" y="367" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">nginx :80 / :443</text>
  <rect x="734" y="391" width="262" height="34" rx="8" fill="#eef2ff" stroke="#4338ca"/>
  <text x="865" y="413" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">Frontcache :9080</text>

  <!-- edge -> origin -->
  <line x1="175" y1="442" x2="330" y2="502" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="520" y1="442" x2="520" y2="502" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="865" y1="442" x2="700" y2="502" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="238" y="470" text-anchor="middle" font-size="11.5" fill="#64748b">cache miss only</text>
  <text x="520" y="470" text-anchor="middle" font-size="11.5" fill="#64748b">cache miss only</text>
  <text x="800" y="470" text-anchor="middle" font-size="11.5" fill="#64748b">cache miss only</text>

  <!-- ============ origin ============ -->
  <rect x="300" y="504" width="440" height="116" rx="14" fill="url(#gOrigin)" stroke="#dc2626" stroke-width="2"/>
  <g stroke="#b91c1c" stroke-width="1.6" fill="none">
    <path d="M326,536 h22 v18 a11,11 0 0 1 -22,0 z" fill="#fff1f2"/>
    <path d="M348,540 h6 a6,6 0 0 1 0,12 h-6"/>
    <path d="M331,528 q3,-5 0,-9 M339,528 q3,-5 0,-9"/>
  </g>
  <text x="545" y="534" text-anchor="middle" font-size="17" font-weight="bold" fill="#991b1b">origin.hobbyray.com</text>
  <rect x="322" y="568" width="396" height="34" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="520" y="590" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e293b">FrontCache — second cache tier</text>

  <!-- ============ backend tier ============ -->
  <rect x="130" y="656" width="790" height="120" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="7 4"/>

  <!-- origin -> backends -->
  <line x1="420" y1="620" x2="292" y2="676" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="520" y1="620" x2="520" y2="676" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="620" y1="620" x2="762" y2="676" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Solr -->
  <rect x="155" y="682" width="210" height="56" rx="12" fill="url(#gSolr)" stroke="#0284c7" stroke-width="2"/>
  <g stroke="#0369a1" stroke-width="2.4" fill="none"><circle cx="187" cy="706" r="11" fill="#ffffff"/><line x1="195" y1="714" x2="204" y2="723"/></g>
  <text x="275" y="716" text-anchor="middle" font-size="15" font-weight="bold" fill="#075985">Solr</text>

  <!-- SQL DB -->
  <path d="M420,690 v40 a100,12 0 0 0 200,0 v-40 z" fill="url(#gDb)" stroke="#16a34a" stroke-width="2"/>
  <ellipse cx="520" cy="690" rx="100" ry="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="520" y="720" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">SQL DB</text>

  <!-- Other backend services -->
  <rect x="648" y="682" width="252" height="56" rx="12" fill="url(#gSvc)" stroke="#ea580c" stroke-width="2"/>
  <g transform="translate(677,710)" stroke="#c2410c" stroke-width="1.8" fill="none">
    <circle r="11.5" fill="#ffffff"/><circle r="4.5"/>
    <g fill="#c2410c" stroke="none">
      <rect x="-2.5" y="-16.5" width="5" height="6" rx="1.2"/>
      <rect x="-2.5" y="-16.5" width="5" height="6" rx="1.2" transform="rotate(60)"/>
      <rect x="-2.5" y="-16.5" width="5" height="6" rx="1.2" transform="rotate(120)"/>
      <rect x="-2.5" y="-16.5" width="5" height="6" rx="1.2" transform="rotate(180)"/>
      <rect x="-2.5" y="-16.5" width="5" height="6" rx="1.2" transform="rotate(240)"/>
      <rect x="-2.5" y="-16.5" width="5" height="6" rx="1.2" transform="rotate(300)"/>
    </g>
  </g>
  <text x="789" y="716" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7c2d12">Other Backend Services</text>

  <text x="520" y="762" text-anchor="middle" font-size="11.5" fill="#64748b">origin backends — reached only on a true miss; Frontcache absorbs everything else</text>

  <!-- ============ legend ============ -->
  <rect x="30" y="800" width="980" height="66" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="48" y="823" font-size="12" font-weight="bold" fill="#334155">Legend</text>
  <rect x="112" y="813" width="14" height="12" rx="3" fill="url(#gGslb)" stroke="#d97706"/><text x="132" y="823" font-size="11.5" fill="#475569">GSLB entry point</text>
  <rect x="250" y="813" width="14" height="12" rx="3" fill="url(#gUs)" stroke="#4338ca"/>
  <text x="270" y="823" font-size="11.5" fill="#475569">edge: nginx :80/:443 → Frontcache :9080 (standalone)</text>
  <rect x="646" y="813" width="14" height="12" rx="3" fill="url(#gOrigin)" stroke="#dc2626"/><text x="666" y="823" font-size="11.5" fill="#475569">origin: Java app + FrontCache Filter</text>
  <rect x="872" y="813" width="14" height="12" rx="3" fill="url(#gSolr)" stroke="#0284c7"/><rect x="890" y="813" width="14" height="12" rx="3" fill="url(#gDb)" stroke="#16a34a"/><rect x="908" y="813" width="14" height="12" rx="3" fill="url(#gSvc)" stroke="#ea580c"/><text x="928" y="823" font-size="11.5" fill="#475569">backends</text>
  <line x1="112" y1="848" x2="146" y2="848" stroke="#475569" stroke-width="1.6" marker-end="url(#arr)"/><text x="156" y="852" font-size="11.5" fill="#475569">request path (each hop only on a miss)</text>
  <text x="1000" y="852" text-anchor="end" font-size="11.5" fill="#64748b">An edge miss can still be served by the origin's own filter cache.</text>
</svg>
