<svg viewBox="0 0 900 440" width="900" height="440" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#475569"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#16a34a"/></marker>
    <marker id="y" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#ca8a04"/></marker>
    <marker id="s" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="440" fill="#ffffff"/>

  <!-- client -->
  <ellipse cx="70" cy="130" rx="58" ry="32" fill="#f1f5f9" stroke="#475569"/>
  <text x="70" y="126" text-anchor="middle">Browser /</text>
  <text x="70" y="142" text-anchor="middle">Bot</text>

  <!-- frontcache host -->
  <rect x="200" y="40" width="300" height="252" rx="8" fill="#eef2ff" stroke="#4338ca"/>
  <text x="350" y="64" text-anchor="middle" font-weight="bold" fill="#4338ca">Frontcache host</text>

  <rect x="225" y="82" width="250" height="52" rx="6" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="350" y="104" text-anchor="middle">FrontCache</text>
  <text x="350" y="122" text-anchor="middle" font-size="11" fill="#4338ca">reverse proxy, :9080 / :9443</text>

  <!-- caches, directly under the proxy -->
  <path d="M243,168 v26 a47,9 0 0 0 94,0 v-26 a47,9 0 0 0 -94,0 z" fill="#dcfce7" stroke="#16a34a"/>
  <ellipse cx="290" cy="168" rx="47" ry="9" fill="#dcfce7" stroke="#16a34a"/>
  <text x="290" y="192" text-anchor="middle" font-size="11">L1 Ehcache</text>

  <path d="M366,168 v26 a47,9 0 0 0 94,0 v-26 a47,9 0 0 0 -94,0 z" fill="#dcfce7" stroke="#16a34a"/>
  <ellipse cx="413" cy="168" rx="47" ry="9" fill="#dcfce7" stroke="#16a34a"/>
  <text x="413" y="192" text-anchor="middle" font-size="11">L2 Lucene</text>

  <line x1="310" y1="134" x2="296" y2="156" stroke="#16a34a" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <line x1="390" y1="134" x2="406" y2="156" stroke="#16a34a" stroke-dasharray="4 3" marker-end="url(#g)"/>

  <rect x="225" y="222" width="250" height="46" rx="6" fill="#e2e8f0" stroke="#475569"/>
  <text x="350" y="242" text-anchor="middle">/frontcache-io</text>
  <text x="350" y="258" text-anchor="middle" font-size="11" fill="#64748b">management API (site key)</text>

  <!-- origin host -->
  <rect x="620" y="60" width="260" height="146" rx="8" fill="#fef2f2" stroke="#dc2626"/>
  <text x="750" y="84" text-anchor="middle" font-weight="bold" fill="#dc2626">Origin host</text>
  <rect x="645" y="102" width="210" height="76" rx="6" fill="#fee2e2" stroke="#dc2626"/>
  <text x="750" y="126" text-anchor="middle">Web app — any language</text>
  <text x="750" y="146" text-anchor="middle" font-size="11" fill="#64748b">PHP / Node / Python / Java</text>
  <text x="750" y="164" text-anchor="middle" font-size="11" fill="#64748b">emits x-frontcache-* headers</text>

  <!-- console: a separate process -->
  <rect x="30" y="330" width="210" height="52" rx="6" fill="#e2e8f0" stroke="#475569"/>
  <text x="135" y="352" text-anchor="middle">frontcache-console :7080</text>
  <text x="135" y="370" text-anchor="middle" font-size="11" fill="#64748b">separate process, never public</text>

  <!-- app code -->
  <rect x="640" y="330" width="220" height="52" rx="6" fill="#fff7ed" stroke="#ca8a04"/>
  <text x="750" y="352" text-anchor="middle">Origin app code</text>
  <text x="750" y="370" text-anchor="middle" font-size="11" fill="#64748b">frontcache-agent</text>

  <!-- edges -->
  <line x1="130" y1="122" x2="196" y2="108" stroke="#475569" marker-end="url(#a)"/>
  <text x="163" y="100" text-anchor="middle" font-size="11">HTTP :9080</text>

  <line x1="475" y1="108" x2="616" y2="126" stroke="#475569" marker-end="url(#a)"/>
  <text x="558" y="88" text-anchor="middle" font-size="11">cache miss →</text>
  <text x="558" y="102" text-anchor="middle" font-size="11">origin-host:port</text>

  <line x1="185" y1="330" x2="221" y2="256" stroke="#64748b" stroke-dasharray="4 3" marker-end="url(#s)"/>
  <text x="120" y="300" font-size="11" fill="#64748b">stats +</text>
  <text x="120" y="314" font-size="11" fill="#64748b">invalidation</text>

  <line x1="638" y1="348" x2="481" y2="252" stroke="#ca8a04" stroke-dasharray="4 3" marker-end="url(#y)"/>
  <text x="556" y="340" text-anchor="middle" font-size="11" fill="#ca8a04">invalidate on content change</text>
</svg>
