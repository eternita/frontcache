<svg viewBox="0 0 780 380" width="780" height="380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#475569"/></marker>
    <marker id="g" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#16a34a"/></marker>
    <marker id="y" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="#ca8a04"/></marker>
  </defs>
  <rect x="0" y="0" width="780" height="380" fill="#ffffff"/>

  <ellipse cx="75" cy="150" rx="58" ry="30" fill="#f1f5f9" stroke="#475569"/>
  <text x="75" y="146" text-anchor="middle">Browser /</text>
  <text x="75" y="162" text-anchor="middle">Bot</text>

  <rect x="200" y="40" width="300" height="210" rx="8" fill="#eef2ff" stroke="#4338ca"/>
  <text x="350" y="64" text-anchor="middle" font-weight="bold" fill="#4338ca">App servlet container (one JVM)</text>

  <rect x="230" y="80" width="240" height="50" rx="6" fill="#e0e7ff" stroke="#4338ca"/>
  <text x="350" y="101" text-anchor="middle">FrontCacheFilter</text>
  <text x="350" y="118" text-anchor="middle" font-size="11" fill="#4338ca">url-pattern /example/*</text>

  <rect x="230" y="170" width="240" height="50" rx="6" fill="#e2e8f0" stroke="#475569"/>
  <text x="350" y="191" text-anchor="middle">Your servlets / JSPs</text>
  <text x="350" y="208" text-anchor="middle" font-size="11" fill="#64748b">(MVC controllers)</text>

  <!-- the filter chain, both ways -->
  <line x1="430" y1="132" x2="430" y2="167" stroke="#475569" marker-end="url(#a)"/>
  <line x1="250" y1="168" x2="250" y2="133" stroke="#475569" marker-end="url(#a)"/>
  <text x="258" y="154" font-size="11" fill="#64748b">↑ response</text>
  <text x="422" y="154" text-anchor="end" font-size="11" fill="#64748b">miss ↓</text>
  <text x="350" y="240" text-anchor="middle" font-size="11" fill="#64748b">the filter reads your x-frontcache-* headers</text>

  <!-- caches -->
  <path d="M580,72 v50 a70,10 0 0 0 140,0 v-50 a70,10 0 0 0 -140,0 z" fill="#dcfce7" stroke="#16a34a"/>
  <ellipse cx="650" cy="72" rx="70" ry="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="650" y="100" text-anchor="middle">L1 Ehcache</text>
  <text x="650" y="115" text-anchor="middle" font-size="10" fill="#64748b">in-memory</text>

  <path d="M580,182 v50 a70,10 0 0 0 140,0 v-50 a70,10 0 0 0 -140,0 z" fill="#dcfce7" stroke="#16a34a"/>
  <ellipse cx="650" cy="182" rx="70" ry="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="650" y="210" text-anchor="middle">L2 Lucene</text>
  <text x="650" y="225" text-anchor="middle" font-size="10" fill="#64748b">FRONTCACHE_HOME/cache</text>

  <line x1="470" y1="95" x2="576" y2="82" stroke="#16a34a" stroke-dasharray="4 3" marker-end="url(#g)"/>
  <line x1="470" y1="116" x2="576" y2="180" stroke="#16a34a" stroke-dasharray="4 3" marker-end="url(#g)"/>

  <!-- config -->
  <path d="M265,302 v40 a85,10 0 0 0 170,0 v-40 a85,10 0 0 0 -170,0 z" fill="#fff7ed" stroke="#ca8a04"/>
  <ellipse cx="350" cy="302" rx="85" ry="10" fill="#fff7ed" stroke="#ca8a04"/>
  <text x="350" y="330" text-anchor="middle">FRONTCACHE_HOME/conf</text>
  <line x1="350" y1="292" x2="350" y2="254" stroke="#ca8a04" stroke-dasharray="4 3" marker-end="url(#y)"/>

  <!-- client -->
  <line x1="133" y1="150" x2="196" y2="148" stroke="#475569" marker-end="url(#a)"/>
  <text x="164" y="140" text-anchor="middle" font-size="11">HTTP :8080</text>
</svg>
