############# Frontcache configuration - SERVLET FILTER mode ###################
#
# This is the template for use case #1: FrontCacheFilter running inside your own Java web
# app's container. The app IS the origin - the filter passes cache misses down the filter
# chain - so there is deliberately NO front-cache.origin-host here. If you set one, you are
# describing standalone reverse-proxy mode and want the server bundle instead.
#
# Point the container at this directory with:
#   -Dfrontcache.home=/path/to/FRONTCACHE_HOME
#   -Dlogback.configurationFile=/path/to/FRONTCACHE_HOME/conf/fc-logback.xml
# (or set the FRONTCACHE_HOME environment variable).
#
# Docs: https://github.com/eternita/frontcache/wiki

############# what you must change #############################################

# This node's public domain. Used for redirect rewriting, request logging and guard rules.
front-cache.default-domain=CHANGE_ME.example.com

# Secret guarding the management API (/frontcache-io) and cache invalidation from app code.
# Anything that can reach the API with this key can flush your cache - treat it as a secret.
front-cache.site-key=CHANGE_ME

# The CLIENT-FACING ports of your app. These are what redirect rewriting uses, so behind a
# TLS terminator they are 80/443, NOT the port your container listens on.
front-cache.http-port=80
front-cache.https-port=443

# The port the management API may be reached on; requests arriving on any other port are
# refused. Firewall it, or set it to an internal-only connector's port.
front-cache.management.port=443

# This node's identity, returned in the x-frontcache-id response header. Give every node a
# distinct value so a response can be traced back to the instance that served it.
# (Also settable in conf/frontcache.id, which is easier to template per host.)
#front-cache.id=app-node-1

############# Cache Processor ##################################################
# L1 = Ehcache in memory, L2 = a Lucene index under FRONTCACHE_HOME/cache.
# Alternatives: InMemoryCacheProcessor (L1 only), NoopCacheProcessor (pass-through, for A/B).
front-cache.cache-processor.impl=org.frontcache.cache.impl.L1L2CacheProcessor

############# Include Processor ################################################
# Resolves <fc:include url="..."/> markers. The concurrent implementation fetches the
# fragments of one page in parallel; the serial one is the default if this is unset.
front-cache.include-processor.impl=org.frontcache.include.impl.ConcurrentIncludeProcessor
front-cache.include-processor.impl.concurrent.thread-amount=32
front-cache.include-processor.impl.concurrent.timeout=3000

############# Fallbacks ########################################################
# Serves canned content when a component fails or its Hystrix circuit is open.
# See conf/fallbacks.conf for the URI-pattern -> file mapping.
front-cache.fallback-resolver.impl=org.frontcache.hystrix.fr.FileBasedFallbackResolver

############# Diagnostics ######################################################
# Adds per-fragment timing/trace headers to responses. Invaluable while you are working out
# what caches and what does not; turn it off once you are done, since it exposes internals.
front-cache.log-to-headers=true

############# Guard rules ######################################################
# Checks applied before cache and origin - see conf/guard-rules.conf.
front-cache.max-request-uri-length=4096

