# Minimal FRONTCACHE_HOME/conf/frontcache.properties used ONLY by the guard-rule tests.
# Keep this file free of subdirectories under conf/ - each subdir would be picked up as an
# extra domain by FCConfig.getDomains().

front-cache.api-key=test-api-key-guard
front-cache.cache-processor.impl=org.frontcache.cache.impl.NoopCacheProcessor

# hosts an absolute redirect target may point at (open-redirect protection)
front-cache.guard-rules.allowed-redirect-hosts=www.example-site.com
