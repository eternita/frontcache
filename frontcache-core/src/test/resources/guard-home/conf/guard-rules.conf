# Guard rules fixture for GuardRuleEngineTests.
# Deliberately holds valid rules AND broken ones - the engine must load the good lines and skip
# each bad one with an error, never failing the whole file.

# --- exemptions first: allow wins and stops evaluation ---
ping-by-ip     | uri~^/fc-ping\.jsp$   | allow
mgmt-by-ip     | uri~^/frontcache-io   | allow
login-page     | uri~^/login\.htm      | allow

# --- 1. scanners hitting the node by IP ---
ip-access      | host:ip               | redirect:301 https://www.example-site.com/en/welcome.htm

# --- 2. anonymous users on account-only pages ---
anon-analytics | uri~^/[a-z]{2}/ccc/va/ ; !cookie:hruc | redirect:302 https://www.example-site.com/login.htm?return=${url:enc}

# --- a rule still being validated: observed and logged, never acted on ---
noisy-bots     | uri~^/search\.htm ; client-type:bot | reject:429 429 Slow Down | dry-run

# --- broken lines below: each must be skipped, the rules above must survive ---
open-redirect  | uri~^/anything        | redirect:302 https://evil.example.com/
self-loop      | uri~^/login2\.htm     | redirect:302 https://www.example-site.com/login2.htm
bad-regex      | uri~^/[unclosed       | allow
unknown-pred   | cookies:hruc          | allow
no-action      | uri~^/x
