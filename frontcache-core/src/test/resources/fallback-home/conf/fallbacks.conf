# Host-agnostic fallback config for FileBasedFallbackResolverTest.
#
# Format:  <url-regex>  <file-in-fallbacks-dir>  [init-url(optional)]
#
# The resolver matches with Pattern.matcher(url).matches() (FULL-string match), so each
# regex must span scheme -> host -> path -> query. The host+scheme is generalized to
# `https?://[^/]+` so the same rule serves any environment (www.example-site.com, a staging
# host, localhost:9080, ...). `.` is escaped as `\.`, `?` as `\?`.
#
# Entries are matched in order and the FIRST match wins, so the strict include-header rule
# must precede any broader include-header rule (there is only the strict one here).

# https://www.example-site.com/fc/include-header.htm?view=desktop&locale=en  (exact query)
https?://[^/]+/fc/include-header\.htm\?view=desktop&locale=en include-header-en.html

# https://www.example-site.com/en/welcome.htm  (any 2-letter locale segment)
https?://[^/]+/[a-z]{2}/welcome\.htm welcome.html

# https://www.example-site.com/search.htm  (+ optional query)
https?://[^/]+/search\.htm.* search.html

# https://www.example-site.com/coins_by_dates.htm  (+ optional query)
https?://[^/]+/coins_by_dates\.htm.* coins_by_dates.html

# https://www.example-site.com/en/crawled-coins-prices.htm  (any 2-letter locale segment)
https?://[^/]+/[a-z]{2}/crawled-coins-prices\.htm.* crawled-coins-prices.html

# https://www.example-site.com/coin-visit-counter.htm  (+ optional query)
https?://[^/]+/coin-visit-counter\.htm.* coin-visit-counter.html

# https://www.example-site.com/fc/recent-updates-add.htm?locale=en  (+ optional query)
https?://[^/]+/fc/recent-updates-add\.htm.* recent-updates-add.html

# https://www.example-site.com/fc/include-footer.htm?locale=en  (+ optional query)
https?://[^/]+/fc/include-footer\.htm.* include-footer.html
