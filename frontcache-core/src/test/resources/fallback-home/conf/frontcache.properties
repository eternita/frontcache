# Minimal FRONTCACHE_HOME/conf/frontcache.properties used ONLY by
# FileBasedFallbackResolverTest. No `front-cache.domains` line is declared, so
# FCConfig.getDomains() returns empty and every fallback lives under DEFAULT_DOMAIN
# (the top-level conf/fallbacks.conf). Keep this file free of subdirectories under
# conf/ - each subdir would be picked up as an extra domain.

front-cache.site-key=test-site-key-fallback
front-cache.cache-processor.impl=org.frontcache.cache.impl.NoopCacheProcessor
