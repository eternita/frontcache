# Minimal FRONTCACHE_HOME/conf used by the frontcache-core unit tests (the test task pins
# -Dfrontcache.home here). FileBasedFallbackResolverTest reads conf/fallbacks.conf;
# FCConfigSingleSiteConfigTest reads conf/bots.conf and conf/dynamic-urls.conf.
#
# One node serves one site, so all three are node-wide - there is no per-domain layering.

front-cache.api-key=test-api-key-fallback
front-cache.cache-processor.impl=org.frontcache.cache.impl.NoopCacheProcessor
