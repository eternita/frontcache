# Minimal resilience.properties for the core unit tests.
# Read by FcResilienceConfig (which tolerates the file being absent - unlike FCConfig's old Archaius
# block, which threw). Kept so the fixture home looks like a real FRONTCACHE_HOME, and so the default
# resolution path is exercised at least once.
resilience.command.default.execution.isolation.thread.interruptOnTimeout=true
