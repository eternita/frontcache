# Single source of truth for the Frontcache version.
#
# Read by the root build.gradle and applied to every subproject, so it drives the
# Maven coordinates, the distribution archive names (frontcache-server-<version>.zip),
# the Docker image tags and the installer's default --version.
#
# gradle.properties is deliberately NOT used for this: it is git-ignored (see .gitignore),
# so a version living there would not be checked in.
version=2.5.0
