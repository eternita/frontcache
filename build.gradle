plugins {
	id 'com.github.hierynomus.license' version '0.16.1'
}

// Jetty 12 (Jakarta EE10).
ext.jettyVersion = '12.0.38'   // 12.0.30+ bundles ASM >= 9.9, required to scan Java 25 (class v69) bytecode
                               // stay on the 12.0.x (Jakarta EE10 / Servlet 6.0) line - 12.1.x moves to EE11

license {
    ignoreFailures = true
    strictCheck = true
    include '**/*.java'
    mapping {
        java = 'SLASHSTAR_STYLE'
    }
}

//build.dependsOn licenseFormat

// Single source of truth for the project version (see version.properties). It cannot live
// in gradle.properties - that file is git-ignored (see .gitignore), so it would not be
// checked in. Everything downstream derives from this: Maven coordinates, distribution
// archive names, Docker tags, the installer's default --version.
ext.frontcacheVersion = {
	def props = new Properties()
	file('version.properties').withInputStream { props.load(it) }
	def v = props.getProperty('version')
	if (!v?.trim()) {
		throw new GradleException("version.properties: 'version' is missing or empty")
	}
	v.trim()
}()

subprojects {
	apply plugin: 'java-library' // 'java-library' (not 'java') so 'api' transitive deps are available
	apply plugin: 'jacoco'
    version = rootProject.frontcacheVersion
    group = 'org.frontcache'

	// Build/test with Java 25 via a toolchain, so the JDK launching Gradle is
	// decoupled from the project's target. Gradle auto-detects the installed
	// JDK 25 for compilation and test execution. Jetty 12 / Jakarta EE10 require
	// Java 17 as a baseline; we target the 25 LTS.
	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(25)
		}
	}

	// Emit Java 25 bytecode.
	tasks.withType(JavaCompile).configureEach {
		options.release = 25
	}

	// 'provided' deps (e.g. servlet-api) are on compile & test classpaths but
	// NOT on runtimeClasspath, so they are excluded from the assembled WAR.
	configurations {
		provided
	}

	sourceSets {
		main.compileClasspath += configurations.provided
		test.compileClasspath += configurations.provided
		test.runtimeClasspath += configurations.provided
	}

	jacoco.toolVersion = '0.8.15'   // 0.8.13+ understands Java 25 class files

    dependencies {
		testImplementation 'junit:junit:4.13.2'
    }

    repositories {
        mavenLocal()
        mavenCentral()
    }

    // Unit-test coverage. Output mirrors the test reports' unit/integration split
    // (reports/tests/unit), so this lands in reports/jacoco/unit — the e2e suite's
    // report is reports/jacoco/integration in frontcache-tests/build.gradle.
    jacocoTestReport {
        reports {
            html.required = true
            xml.required = true
            csv.required = false
            html.outputLocation = layout.buildDirectory.dir('reports/jacoco/unit')
            xml.outputLocation = layout.buildDirectory.file('reports/jacoco/unit/jacocoTestReport.xml')
        }
    }
	tasks.withType(Test) {
		testLogging {
			showStandardStreams = true
			exceptionFormat = 'full'
		}
	}

	test {
		reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/unit')
		reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/unit')

		if (System.getProperty('DEBUG', 'false') == 'true') {
			jvmArgs '-Xdebug',
				'-Xrunjdwp:transport=dt_socket,server=y,suspend=y,address=8001'
		}
	}

	check.dependsOn jacocoTestReport

	// Also emit the report for a bare `gradlew :module:test`, not only via check/build.
	test.finalizedBy jacocoTestReport
}


// Resolve AWS credentials the way the old maven-s3-wagon did. Gradle's AwsCredentials —
// unlike the wagon — does NOT consult the AWS default credential chain, so we parse the
// shared credentials file (~/.aws/credentials, profile from $AWS_PROFILE or 'default')
// as a fallback after -P properties and env vars.
def awsSharedCreds() {
	def file = new File(System.getProperty('user.home'), '.aws/credentials')
	def profile = System.getenv('AWS_PROFILE') ?: 'default'
	def creds = [:]
	if (file.exists()) {
		def current = null
		file.eachLine { raw ->
			def line = raw.trim()
			if (line.startsWith('[') && line.endsWith(']')) {
				current = line[1..-2].trim()
			} else if (current == profile && line.contains('=')) {
				def i = line.indexOf('=')
				creds[line.substring(0, i).trim()] = line.substring(i + 1).trim()
			}
		}
	}
	creds
}

// The single publish target for every published module.
def eternitaMaven(repos) {
	repos.maven {
		url = 's3://repo.eternita.co/maven2'
		credentials(AwsCredentials) {
			def shared = awsSharedCreds()
			accessKey = findProperty('awsAccessKey') ?: System.getenv('AWS_ACCESS_KEY_ID') ?: shared['aws_access_key_id']
			secretKey = findProperty('awsSecretKey') ?: System.getenv('AWS_SECRET_ACCESS_KEY') ?: shared['aws_secret_access_key']
		}
	}
}

// Artifact deployment (was pom.xml). Publishes the two library modules to the Eternita
// S3 repo; the two distribution bundles are published from the block further down.
// Gradle's maven-publish speaks s3:// natively.
// Run with: ./gradlew publish  (or publishToMavenLocal for a dry run)
configure([project(':frontcache-core'), project(':frontcache-agent')]) {
	apply plugin: 'maven-publish'

	java {
		withSourcesJar()   // replaces maven-source-plugin
		withJavadocJar()   // replaces maven-javadoc-plugin
	}

	// -Xdoclint:none equivalent — don't fail the build on javadoc lint
	tasks.withType(Javadoc).configureEach {
		options.addStringOption('Xdoclint:none', '-quiet')
	}

	publishing {
		publications {
			mavenJava(MavenPublication) {
				from components.java // emits api deps into the POM with 'compile' scope; 'provided' stays out
				pom {
					name = "${project.group}:${project.name}"
					description = 'Web page/fragment cache with server side includes'
					url = 'https://github.com/eternita/frontcache'
					licenses {
						license {
							name = 'Frontcache license'
							url  = 'https://www.eternita.co/frontcache-license.html'
						}
					}
					developers {
						developer {
							name = 'Dmitriy Pavlikovskiy'
							email = 'pdaviti@gmail.com'
							organization = 'Eternita'
							organizationUrl = 'https://www.eternita.co'
						}
						developer {
							name = 'Serhiy Pavlikovskiy'
							email = 'pavlikovskiy@gmail.com'
							organization = 'Eternita'
							organizationUrl = 'https://www.eternita.co'
						}
					}
					scm {
						connection = 'scm:git:git://github.com/eternita/frontcache.git'
						developerConnection = 'scm:git:ssh://github.com:eternita/frontcache.git'
						url = 'https://github.com/eternita/frontcache/tree/master'
					}
				}
			}
		}
		repositories {
			rootProject.eternitaMaven(delegate)
		}
	}
}


project(':frontcache-core') {

	// ---- FRONTCACHE_HOME skeleton for filter mode (use case #1) ---------------
	// Filter-mode customers put frontcache-core on their app's classpath, but they still need
	// a conf/ directory - and they cannot clone this repo to get one. So the skeleton is
	// published alongside the jar:
	//     org.frontcache:frontcache-core:<v>:home@zip
	//
	// Everything except frontcache.properties is taken from the server's conf/ so there is one
	// copy of bots.conf, guard-rules.conf, hystrix.properties and friends. frontcache.properties
	// is the one file that genuinely differs: in filter mode the app IS the origin, so the
	// standalone template's origin-host/origin-port section would be actively misleading.
	def frontcacheHomeZip = tasks.register('frontcacheHomeZip', Zip) {
		group = 'distribution'
		description = 'FRONTCACHE_HOME skeleton for servlet-filter mode'
		archiveBaseName = 'frontcache-home'
		archiveClassifier = ''
		destinationDirectory = layout.buildDirectory.dir('distributions')

		into('FRONTCACHE_HOME') {
			from(rootProject.file('frontcache-server/FRONTCACHE_HOME')) {
				include 'conf/**', 'fallbacks/**', 'cache/**'
				// the standalone properties template, this node's identity, and the stale
				// pre-2.0 ReadMe are all replaced or dropped below
				exclude 'conf/frontcache.properties', 'conf/frontcache.id', 'ReadMe.txt'
				exclude 'cache/l2-lucene-index/*', 'logs/*'
				exclude '**/.DS_Store'
			}
			from('src/dist/frontcache.properties') { into 'conf' }
		}
		from('src/dist/README-FILTER.md')
		from(rootProject.file('LICENSE'))
	}

	// Attached to the existing library publication, so `./gradlew publish` ships it with the jar.
	afterEvaluate {
		publishing.publications.named('mavenJava') {
			artifact(frontcacheHomeZip) {
				classifier = 'home'
				extension  = 'zip'
			}
		}
	}

    dependencies {
        provided        'jakarta.servlet:jakarta.servlet-api:6.0.0'
		provided        'jakarta.servlet.jsp:jakarta.servlet.jsp-api:3.1.1'

		api 			'com.fasterxml.jackson.core:jackson-databind:2.22.1'
		api         	'com.fasterxml.jackson.core:jackson-annotations:2.22'
        api         	'org.apache.httpcomponents:httpclient:4.5.14' // final 4.5.x; 5.x is a package/API migration
        api         	'commons-io:commons-io:2.22.0'
        api         	'ch.qos.logback:logback-classic:1.5.38'
		api         	'com.netflix.hystrix:hystrix-core:1.5.18'
		api         	'com.netflix.hystrix:hystrix-metrics-event-stream:1.5.18'
		api         	'com.netflix.hystrix:hystrix-serialization:1.5.18' // provides com.netflix.hystrix.serial.SerialHystrixDashboardData (not pulled transitively)
        api         	'net.sf.ehcache:ehcache:2.10.9.2'
        api         	'com.google.code.gson:gson:2.14.0'
        api         	'org.apache.lucene:lucene-core:10.5.1'
        api         	'com.typesafe:config:1.4.9'

        testImplementation     'junit:junit:4.13.2'
        testImplementation     'org.mockito:mockito-core:5.23.0'
    }

    test {
        // FCConfig is a JVM-global singleton initialized once on first touch, and several core
        // tests (L1L2 cache tests, FileBasedFallbackResolverTest) trigger that init. Without a
        // valid frontcache.home the init throws and poisons FCConfig for the rest of the JVM
        // (NoClassDefFoundError), making the failure depend on test-execution order. Pin a minimal
        // fixture home so init always succeeds regardless of which test runs first.
        systemProperty 'frontcache.home', "${projectDir}/src/test/resources/fallback-home"
    }
}


project(':frontcache-agent') {
	dependencies {
        api         'org.apache.httpcomponents:httpclient:4.5.14' // final 4.5.x; 5.x is a package/API migration
	}
}



project(':frontcache-server') {
	apply plugin: 'war'

	dependencies {
		implementation project(':frontcache-core')

		// Embedded Jetty 12 (EE10) for the standalone `appRun` task.
		provided "org.eclipse.jetty.ee10:jetty-ee10-webapp:${jettyVersion}"
		provided "org.eclipse.jetty.ee10:jetty-ee10-annotations:${jettyVersion}"
		provided "org.eclipse.jetty.ee10:jetty-ee10-apache-jsp:${jettyVersion}"
		provided "org.eclipse.jetty.ee10:jetty-ee10-glassfish-jstl:${jettyVersion}"
	}

	def copyWar = tasks.register('copyWar', Copy) {
		  from tasks.named('war')
		  into 'server/frontcache-base/webapps'
		  rename '(.*).war', 'ROOT.war'
	}
	build.finalizedBy(copyWar)

	// Assemble the standalone launcher's runtime classpath into server/lib. The
	// remote deployment runs `java -cp "server/lib/*" org.frontcache.server.FrontcacheJettyServer`
	// The launcher only needs the Jetty EE10
	// jars (in 'provided', deliberately kept out of the war) plus its own class; the
	// war carries frontcache-core + its deps in WEB-INF/lib, so they stay out of here.
	def copyServerLibs = tasks.register('copyServerLibs', Sync) {
		from configurations.provided
		from tasks.named('jar')
		into 'server/lib'
	}
	build.finalizedBy(copyServerLibs)

	// ---- binary distribution -------------------------------------------------
	// `./gradlew :frontcache-server:distZip` (or distTar) assembles a self-contained
	// bundle under build/distributions: the launcher, its Jetty 12 EE10 classpath, the
	// war and a config skeleton. This is the base artifact of every delivery channel -
	// the Docker image and the VM installer unpack THIS rather than re-running Gradle.
	// See docs/frontcache-distribution-proposal.md.
	//
	// The archive is built from the task outputs (war / jar / configurations.provided)
	// rather than from the in-place server/ tree, so a developer's leftovers there -
	// a populated server/lib, a hand-copied frontcache-console.war - can never leak
	// into a release.
	apply plugin: 'distribution'

	distributions {
		main {
			distributionBaseName = 'frontcache-server'
			contents {
				// macOS sidecars: Jetty globs *.ini and dies trying to parse a ._ file as UTF-8
				exclude '**/.DS_Store', '**/._*'

				// launcher classpath: the Jetty EE10 jars (deliberately kept out of the war)
				// plus this module's jar, which holds FrontcacheJettyServer
				from(configurations.provided) { into 'server/lib' }
				from(tasks.named('jar'))      { into 'server/lib' }

				// the webapp; frontcache-core and its deps ride along in WEB-INF/lib
				from(tasks.named('war')) {
					into 'server/frontcache-base/webapps'
					rename '(.*).war', 'ROOT.war'
				}

				// checked-in parts of the server tree
				from('server/bin')                 { into 'server/bin'; filePermissions { unix('0755') } }
				from('bin')                        { into 'bin';        filePermissions { unix('0755') } }
				from('server/frontcache-base/etc') { into 'server/frontcache-base/etc' }
				from(files('server/notice.html', 'server/license-eplv10-aslv20.html')) { into 'server' }

				// config skeleton. Runtime state is never shipped: 'logs/*' and
				// 'cache/l2-lucene-index/*' drop a developer's logs and cache index while
				// keeping the (empty) directories. ReadMe.txt is the stale pre-2.0
				// Tomcat/Java-8 instructions, superseded by README-INSTALL.md.
				from('FRONTCACHE_HOME') {
					into 'FRONTCACHE_HOME'
					exclude 'ReadMe.txt', 'logs/*', 'cache/l2-lucene-index/*', 'warmer/warmer.sh'
				}
				from('FRONTCACHE_HOME/warmer') {
					into 'FRONTCACHE_HOME/warmer'
					filePermissions { unix('0755') }
				}

				from(rootProject.file('LICENSE'))
				from('dist/README-INSTALL.md')
			}
		}
	}

	// an uncompressed tar is no use as a download
	tasks.named('distTar', Tar) {
		compression = Compression.GZIP
		archiveExtension = 'tar.gz'
	}

	// Run Frontcache standalone on embedded Jetty 12.
	tasks.register('appRun', JavaExec) {
		group = 'application'
		description = 'Run Frontcache standalone on embedded Jetty 12'
		mainClass = 'org.frontcache.server.FrontcacheJettyServer'
		classpath = sourceSets.main.runtimeClasspath + configurations.provided
		systemProperty 'frontcache.jetty.port', '9080'
		systemProperty 'frontcache.jetty.webapp', "${projectDir}/src/main/webapp"
		systemProperty 'frontcache.home', "${projectDir}/FRONTCACHE_HOME"
		systemProperty 'org.frontcache.console.config', "${projectDir}/FRONTCACHE_HOME/conf/frontcache-console.conf"
		systemProperty 'logback.configurationFile', "${projectDir}/FRONTCACHE_HOME/conf/fc-logback.xml"
	}
}


project(':frontcache-console') {
	apply plugin: 'war'

	ext {
		springVersion = '6.2.19'   // 6.2.x bundles ASM that knows class v69, required to scan Java 25 bytecode (6.1.x ASM tops out at v67)
		                           // latest of the 6.2.x line - Spring 7 requires Jakarta EE11 / Servlet 6.1, Jetty 12.0.x is EE10
	}

	dependencies {
		implementation project(':frontcache-core')
		implementation "org.springframework:spring-context:${springVersion}"
		implementation "org.springframework:spring-webmvc:${springVersion}"
		implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'
		implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.2'
		implementation 'com.typesafe:config:1.4.9'
		implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'

		testImplementation "org.springframework:spring-test:${springVersion}"
		testImplementation 'org.mockito:mockito-core:5.23.0'
        provided 'jakarta.servlet:jakarta.servlet-api:6.0.0'

		// Embedded Jetty 12 (EE10) for the standalone `appRun` task
		provided "org.eclipse.jetty.ee10:jetty-ee10-webapp:${jettyVersion}"
		provided "org.eclipse.jetty.ee10:jetty-ee10-annotations:${jettyVersion}"
		provided "org.eclipse.jetty.ee10:jetty-ee10-apache-jsp:${jettyVersion}"
		provided "org.eclipse.jetty.ee10:jetty-ee10-glassfish-jstl:${jettyVersion}"
	}

	// ---- binary distribution -------------------------------------------------
	// The console ships as its own bundle (and its own container) - it is a separate
	// process on :7080, not something the standalone server can host: the
	// FrontcacheJettyServer launcher deploys exactly one webapp at context '/'.
	//
	// Layout is flatter than frontcache-server (no legacy server/ nesting):
	//   bin/frontcache-console  lib/*.jar  webapps/ROOT.war  conf/  logs/
	// The war carries Spring + frontcache-core in WEB-INF/lib; lib/ holds only the
	// Jetty 12 EE10 launcher classpath plus this module's jar (ConsoleJettyServer).
	apply plugin: 'distribution'

	distributions {
		main {
			distributionBaseName = 'frontcache-console'
			contents {
				exclude '**/.DS_Store', '**/._*'

				from(configurations.provided) { into 'lib' }
				from(tasks.named('jar'))      { into 'lib' }
				from(tasks.named('war')) {
					into 'webapps'
					rename '(.*).war', 'ROOT.war'
				}

				from('bin')    { into 'bin'; filePermissions { unix('0755') } }
				from('config') { into 'conf' }

				from(rootProject.file('LICENSE'))
				from('dist/README-INSTALL.md')
			}
		}
	}

	tasks.named('distTar', Tar) {
		compression = Compression.GZIP
		archiveExtension = 'tar.gz'
	}

	// Run the console standalone on embedded Jetty 12.
	tasks.register('appRun', JavaExec) {
		group = 'application'
		description = 'Run the Frontcache console on embedded Jetty 12'
		mainClass = 'org.frontcache.console.ConsoleJettyServer'
		classpath = sourceSets.main.runtimeClasspath + configurations.provided
		systemProperty 'frontcache.jetty.port', '7080'
		systemProperty 'frontcache.jetty.webapp', "${projectDir}/src/main/webapp"
		systemProperty 'logback.configurationFile', "${projectDir}/config/fc-logback.xml"
	}
}

// The end-to-end / integration test suite lives in the ':frontcache-tests'
// subproject. It depends on frontcache-core / frontcache-agent as project
// dependencies and is run with the repo-root tests.sh, which starts the two
// embedded Jetty servers, runs the suite, then kills them. It is deliberately
// NOT wired into `check` — the suite needs those servers up first.


// ---- distribution bundles: checksums, verification, publishing ----------------
// The two runnable modules ship as downloadable archives (see
// docs/frontcache-distribution-proposal.md, channel B). They are published to the same
// public-read S3 Maven repo as the jars, so no extra hosting is needed:
//   https://repo.eternita.co/maven2/org/frontcache/frontcache-server/<v>/frontcache-server-<v>.zip
// Release step:  ./gradlew dist && ./gradlew publish
configure([project(':frontcache-server'), project(':frontcache-console')]) {
	apply plugin: 'maven-publish'

	def zipFile = tasks.named('distZip', Zip).flatMap { it.archiveFile }
	def tarFile = tasks.named('distTar', Tar).flatMap { it.archiveFile }
	def zipSha  = layout.buildDirectory.file("distributions/${project.name}-${project.version}.zip.sha256")
	def tarSha  = layout.buildDirectory.file("distributions/${project.name}-${project.version}.tar.gz.sha256")

	// Structural check on the assembled archive: complete, and free of build/runtime
	// leftovers. Runs on every distZip so a broken bundle can't reach a release. A real
	// boot test needs a JDK 25 runtime and a free port, so that lives in
	// scripts/dist/smoke-test-dist.sh and is driven from the release checklist.
	def isServer = project.name == 'frontcache-server'
	def libPrefix = isServer ? 'server/lib/' : 'lib/'
	def requiredEntries = isServer
		? ['server/frontcache-base/webapps/ROOT.war', 'server/bin/frontcache', 'bin/frontcache',
		   'server/frontcache-base/etc/keystore', 'FRONTCACHE_HOME/conf/frontcache.properties',
		   'FRONTCACHE_HOME/conf/fc-logback.xml', 'FRONTCACHE_HOME/conf/guard-rules.conf',
		   'README-INSTALL.md', 'LICENSE']
		: ['webapps/ROOT.war', 'bin/frontcache-console', 'conf/frontcache-console.conf',
		   'conf/fc-logback.xml', 'README-INSTALL.md', 'LICENSE']
	def forbidden = ['.DS_Store', '._', 'frontcache-console.war', '.log', 'l2-lucene-index/']

	def verifyDist = tasks.register('verifyDist') {
		group = 'distribution'
		description = 'Assert the distribution archive is complete and carries no build/runtime leftovers'
		inputs.file(zipFile)
		outputs.upToDateWhen { false }
		def archive = zipFile
		def prefix = "${project.name}-${project.version}/"
		doLast {
			def file = archive.get().asFile
			def sizes = [:]
			new java.util.zip.ZipFile(file).withCloseable { zf ->
				for (entry in zf.entries()) {
					if (entry.name.startsWith(prefix)) {
						sizes[entry.name.substring(prefix.length())] = entry.size
					} else {
						throw new GradleException("${file.name}: entry outside the '${prefix}' root: ${entry.name}")
					}
				}
			}
			def problems = []
			requiredEntries.each { required ->
				if (!sizes.containsKey(required)) problems << "missing: ${required}"
			}
			// only file entries: the empty logs/ and cache/l2-lucene-index/ directories ARE
			// shipped (they show the layout); it is their contents that must never be.
			def files = sizes.keySet().findAll { !it.endsWith('/') }
			forbidden.each { bad ->
				def hits = files.findAll { it.contains(bad) }
				if (hits) problems << "must not be shipped (${bad}): ${hits.take(5)}"
			}
			def jars = sizes.keySet().findAll { it.startsWith(libPrefix) && it.endsWith('.jar') }
			if (jars.size() < 15) problems << "only ${jars.size()} jar(s) under ${libPrefix} - launcher classpath looks incomplete"
			if (!jars.any { it.contains('jetty-ee10-webapp-') }) problems << "no jetty-ee10-webapp jar under ${libPrefix}"
			if (!jars.any { it.contains("${project.name}-${project.version}.jar") }) problems << "no ${project.name}-${project.version}.jar under ${libPrefix}"
			def war = sizes.find { it.key.endsWith('ROOT.war') }
			if (war && war.value < 100_000) problems << "${war.key} is only ${war.value} bytes - war looks empty"

			if (problems) {
				throw new GradleException("${file.name} failed verification:\n  - " + problems.join('\n  - '))
			}
			logger.lifecycle("verifyDist: ${file.name} OK (${sizes.size()} entries, ${jars.size()} launcher jars)")
		}
	}
	tasks.named('distZip') { finalizedBy verifyDist }

	// Not wired into `build` - hashing two archives on every dev build is pointless.
	// It runs from `dist` and, via builtBy below, from `publish`.
	def distChecksums = tasks.register('distChecksums') {
		group = 'distribution'
		description = 'Write .sha256 files next to the distribution archives'
		inputs.files(zipFile, tarFile)
		outputs.files(zipSha, tarSha)
		def pairs = [[zipFile, zipSha], [tarFile, tarSha]]
		doLast {
			pairs.each { srcProvider, outProvider ->
				def src = srcProvider.get().asFile
				def out = outProvider.get().asFile
				def digest = java.security.MessageDigest.getInstance('SHA-256')
				src.withInputStream { ins ->
					byte[] buf = new byte[1 << 16]
					int read
					while ((read = ins.read(buf)) > 0) digest.update(buf, 0, read)
				}
				// same format shasum -c / sha256sum -c expect
				out.text = digest.digest().encodeHex().toString() + '  ' + src.name + '\n'
				logger.lifecycle("sha256: ${out.name}")
			}
		}
	}

	// The installer and the compose files ride along with the SERVER bundle's coordinates, so
	// a customer needs exactly one place to look. They are checked-in scripts rather than build
	// output, so they are published as classified artifacts with their own checksums.
	//
	//   frontcache-server-<v>-installer.sh        scripts/dist/install-frontcache.sh
	//   frontcache-server-<v>-nginx-site.sh       scripts/dist/render-nginx-site.sh  (the
	//                                            installer needs this next to it for --with-nginx)
	//   frontcache-server-<v>-compose.yml         the compose project
	//   frontcache-server-<v>-env.example         its .env template
	def releaseAssets = isServer ? [
		[file: rootProject.file('scripts/dist/install-frontcache.sh'),                classifier: 'installer',   extension: 'sh'],
		[file: rootProject.file('scripts/dist/render-nginx-site.sh'),                 classifier: 'nginx-site',  extension: 'sh'],
		[file: rootProject.file('scripts/docker/fc-server/docker-compose.yml'),        classifier: 'compose',     extension: 'yml'],
		[file: rootProject.file('scripts/docker/fc-server/.env.example'),              classifier: 'env',         extension: 'example'],
	] : []

	// One .sha256 per asset, so `shasum -c` works on the installer too - it is a script the
	// customer is about to run as root.
	def assetChecksums = tasks.register('assetChecksums') {
		group = 'distribution'
		description = 'Write .sha256 files for the published release assets'
		enabled = isServer
		def assets = releaseAssets
		def outDir = layout.buildDirectory.dir('release-assets')
		def assetVersion = project.version.toString()
		def assetName = { a -> "${project.name}-${assetVersion}-${a.classifier}.${a.extension}" }

		inputs.files(assets.collect { it.file })
		// The version is part of every OUTPUT FILE NAME but of no input, so it has to be
		// declared explicitly - both as an input property and by naming the real output files
		// rather than the directory holding them. Declaring only `outputs.dir(...)` made a
		// version bump look up-to-date: the source scripts were unchanged and the directory
		// still existed (full of the PREVIOUS version's files), so the task was skipped and
		// publishing then failed on a .sha256 that had never been written.
		inputs.property('version', assetVersion)
		outputs.files(assets.collect { outDir.get().file("${assetName(it)}.sha256") })

		doLast {
			def dir = outDir.get().asFile
			dir.mkdirs()
			// drop any earlier version's checksums, so the directory only ever describes
			// the version actually being built
			dir.listFiles()?.each { f -> if (f.name.endsWith('.sha256') && !f.name.startsWith("${project.name}-${assetVersion}-")) f.delete() }
			assets.each { asset ->
				def digest = java.security.MessageDigest.getInstance('SHA-256')
				asset.file.withInputStream { ins ->
					byte[] buf = new byte[1 << 16]
					int read
					while ((read = ins.read(buf)) > 0) digest.update(buf, 0, read)
				}
				def name = assetName(asset)
				new File(dir, "${name}.sha256").text =
					digest.digest().encodeHex().toString() + '  ' + name + '\n'
				logger.lifecycle("sha256: ${name}.sha256")
			}
		}
	}

	// Per-platform bundles with an embedded Java runtime (phase 4). They are produced by
	// scripts/dist/build-runtime-bundles.sh, not by Gradle, because building them means
	// downloading a JDK per target and running jlink on that target's platform (jlink cannot
	// cross-link) - work that has no business inside a routine `./gradlew build`.
	//
	// Publishing them is therefore OPT-IN, so a release can never half-publish a platform:
	//   ./scripts/dist/build-runtime-bundles.sh
	//   ./gradlew publish -PwithRuntimeBundles
	// The property makes the artifacts part of the publication; without it the publication is
	// exactly what phases 1-3 produced.
	def runtimeTargets = ['linux-x64', 'linux-aarch64', 'macos-aarch64']
	def wantRuntimeBundles = project.hasProperty('withRuntimeBundles')

	if (wantRuntimeBundles) {
		def missing = runtimeTargets.collectMany { t ->
			['tar.gz', 'zip'].collect { ext ->
				layout.buildDirectory.file("distributions/${project.name}-${project.version}-${t}.${ext}").get().asFile
			}
		}.findAll { !it.exists() }
		if (missing) {
			throw new GradleException(
				"-PwithRuntimeBundles was given but these are not built:\n  " +
				missing.collect { it.name }.join('\n  ') +
				"\nRun ./scripts/dist/build-runtime-bundles.sh first.")
		}
	}

	publishing {
		publications {
			dist(MavenPublication) {
				artifactId = project.name
				artifact tasks.named('distZip')
				artifact tasks.named('distTar')
				artifact(zipSha) { extension = 'zip.sha256'; builtBy distChecksums }
				artifact(tarSha) { extension = 'tar.gz.sha256'; builtBy distChecksums }

				// classifier = the platform, so the coordinates read
				// org.frontcache:frontcache-server:<v>:linux-x64@tar.gz
				if (wantRuntimeBundles) {
					runtimeTargets.each { t ->
						['tar.gz', 'zip'].each { ext ->
							artifact(layout.buildDirectory.file("distributions/${project.name}-${project.version}-${t}.${ext}")) {
								classifier = t
								extension  = ext
							}
							artifact(layout.buildDirectory.file("distributions/${project.name}-${project.version}-${t}.${ext}.sha256")) {
								classifier = t
								extension  = "${ext}.sha256"
							}
						}
					}
				}

				releaseAssets.each { asset ->
					artifact(asset.file) {
						classifier = asset.classifier
						extension  = asset.extension
					}
					artifact(layout.buildDirectory.file(
							"release-assets/${project.name}-${project.version}-${asset.classifier}.${asset.extension}.sha256")) {
						classifier = asset.classifier
						extension  = "${asset.extension}.sha256"
						builtBy assetChecksums
					}
				}
				pom {
					packaging = 'zip'
					name = "${project.group}:${project.name}"
					description = project.name == 'frontcache-server'
						? 'Frontcache standalone server - reverse-proxy page fragment cache (binary distribution)'
						: 'Frontcache console - realtime stats and cache management UI (binary distribution)'
					url = 'https://github.com/eternita/frontcache'
					licenses {
						license {
							name = 'Frontcache license'
							url  = 'https://www.eternita.co/frontcache-license.html'
						}
					}
					scm {
						connection = 'scm:git:git://github.com/eternita/frontcache.git'
						developerConnection = 'scm:git:ssh://github.com:eternita/frontcache.git'
						url = 'https://github.com/eternita/frontcache/tree/master'
					}
				}
			}
		}
		repositories {
			rootProject.eternitaMaven(delegate)
		}
	}
}

// One command to build every downloadable artifact, for the release checklist.
tasks.register('dist') {
	group = 'distribution'
	description = 'Build the server + console distribution archives and their checksums'
	dependsOn ':frontcache-core:frontcacheHomeZip',
	          ':frontcache-server:distZip', ':frontcache-server:distTar', ':frontcache-server:distChecksums',
	          ':frontcache-server:assetChecksums',
	          ':frontcache-console:distZip', ':frontcache-console:distTar', ':frontcache-console:distChecksums'
}
