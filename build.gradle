plugins {
	id 'com.github.hierynomus.license' version '0.16.1'
}

// Jetty 12 (Jakarta EE10). Gretty has been dropped — it tops out at a Jetty 11
// container, so local dev-runs and the e2e harness now embed Jetty 12 directly
// (see :frontcache-server appRun and :frontcache-tests launcher tasks).
ext.jettyVersion = '12.0.16'

class ExecWait extends DefaultTask {
	@Internal String command
	@Internal String ready
	@Internal String directory

	@TaskAction
	def spawnProcess() {

		ProcessBuilder builder = new ProcessBuilder(command.split(' '))
		builder.redirectErrorStream(true)
		builder.directory(new File(directory))
		Process process = builder.start()

		InputStream stdout = process.getInputStream()
		BufferedReader reader = new BufferedReader(new InputStreamReader(stdout))

		def line
		while ((line = reader.readLine()) != null) {
			println line
			if (line.contains(ready)) {
				println "$command is ready"
				break;
			}
		}

		// Keep draining the spawned process' output in a background daemon thread.
		// Otherwise its stdout pipe buffer fills up and the (long-running) server
		// process blocks on its next log write, hanging it mid-test.
		Thread.startDaemon {
			def l
			while ((l = reader.readLine()) != null) {
				println l
			}
		}
	}
}

license {
    ignoreFailures true
    strictCheck true
    include '**/*.java'
    mapping {
        java = 'SLASHSTAR_STYLE'
    }
}

//build.dependsOn licenseFormat

subprojects {
	apply plugin: 'java-library' // 'java-library' (not 'java') so 'api' transitive deps are available
	apply plugin: 'jacoco'
    version = '2.0.0-SNAPSHOT-1'
    group = 'org.frontcache'

	// Build/test with Java 17 via a toolchain, so the JDK launching Gradle is
	// decoupled from the project's target. Gradle auto-detects the installed
	// JDK 17 for compilation and test execution. Jetty 12 / Jakarta EE10 require
	// Java 17 as a baseline.
	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(17)
		}
	}

	// Emit Java 17 bytecode. (The former Java 8 bytecode workaround for Jetty
	// 9.3.6's ASM annotation scanner is gone — Jetty 12 handles modern bytecode.)
	tasks.withType(JavaCompile).configureEach {
		options.release = 17
	}

	// 'provided' deps (e.g. servlet-api) are on compile & test classpaths but
	// NOT on runtimeClasspath, so they are excluded from the assembled WAR.
	configurations {
		provided
	}

	sourceSets {
		main.compileClasspath += configurations.provided
		test.compileClasspath += configurations.provided
		test.runtimeClasspath += configurations.provided
	}

	jacoco.toolVersion = '0.8.11'

    dependencies {
		testImplementation 'junit:junit:4.12'
    }

    repositories {
        mavenLocal()
        mavenCentral()
    }

    jacocoTestReport {
        reports {
            html.required = true
            xml.required = true
            csv.required = false
        }
    }
	tasks.withType(Test) {
		testLogging {
			showStandardStreams = true
			exceptionFormat 'full'
		}
	}

	test {
		reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/unit')
		reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/unit')

		if (System.getProperty('DEBUG', 'false') == 'true') {
			jvmArgs '-Xdebug',
				'-Xrunjdwp:transport=dt_socket,server=y,suspend=y,address=8001'
		}
	}

	check.dependsOn jacocoTestReport
}


// Resolve AWS credentials the way the old maven-s3-wagon did. Gradle's AwsCredentials —
// unlike the wagon — does NOT consult the AWS default credential chain, so we parse the
// shared credentials file (~/.aws/credentials, profile from $AWS_PROFILE or 'default')
// as a fallback after -P properties and env vars.
def awsSharedCreds() {
	def file = new File(System.getProperty('user.home'), '.aws/credentials')
	def profile = System.getenv('AWS_PROFILE') ?: 'default'
	def creds = [:]
	if (file.exists()) {
		def current = null
		file.eachLine { raw ->
			def line = raw.trim()
			if (line.startsWith('[') && line.endsWith(']')) {
				current = line[1..-2].trim()
			} else if (current == profile && line.contains('=')) {
				def i = line.indexOf('=')
				creds[line.substring(0, i).trim()] = line.substring(i + 1).trim()
			}
		}
	}
	creds
}

// Artifact deployment (was pom.xml). Publishes ONLY the two library modules to the
// Eternita S3 repo. Gradle's maven-publish speaks s3:// natively (no maven-s3-wagon
// equivalent needed). Run with: ./gradlew publish  (or publishToMavenLocal for a dry run)
configure([project(':frontcache-core'), project(':frontcache-agent')]) {
	apply plugin: 'maven-publish'

	java {
		withSourcesJar()   // replaces maven-source-plugin
		withJavadocJar()   // replaces maven-javadoc-plugin
	}

	// -Xdoclint:none equivalent — don't fail the build on javadoc lint
	tasks.withType(Javadoc).configureEach {
		options.addStringOption('Xdoclint:none', '-quiet')
	}

	publishing {
		publications {
			mavenJava(MavenPublication) {
				from components.java // emits api deps into the POM with 'compile' scope; 'provided' stays out
				pom {
					name = "${project.group}:${project.name}"
					description = 'Web page/fragment cache with server side includes'
					url = 'https://www.frontcache.org'
					licenses {
						license {
							name = 'Frontcache license'
							url  = 'https://www.eternita.co/frontcache-license.html'
						}
					}
					developers {
						developer {
							name = 'Dmitriy Pavlikovskiy'
							email = 'pdaviti@gmail.com'
							organization = 'Eternita'
							organizationUrl = 'https://www.eternita.co'
						}
						developer {
							name = 'Serhiy Pavlikovskiy'
							email = 'pavlikovskiy@gmail.com'
							organization = 'Eternita'
							organizationUrl = 'https://www.eternita.co'
						}
					}
					scm {
						connection = 'scm:git:git://github.com/eternita/frontcache.git'
						developerConnection = 'scm:git:ssh://github.com:eternita/frontcache.git'
						url = 'https://github.com/eternita/frontcache/tree/master'
					}
				}
			}
		}
		repositories {
			maven {
				url = 's3://repo.eternita.co/maven2'
				credentials(AwsCredentials) {
					def shared = awsSharedCreds()
					accessKey = project.findProperty('awsAccessKey') ?: System.getenv('AWS_ACCESS_KEY_ID') ?: shared['aws_access_key_id']
					secretKey = project.findProperty('awsSecretKey') ?: System.getenv('AWS_SECRET_ACCESS_KEY') ?: shared['aws_secret_access_key']
				}
			}
		}
	}
}


project(':frontcache-core') {

    dependencies {
        provided        'jakarta.servlet:jakarta.servlet-api:6.0.0'
		provided        'jakarta.servlet.jsp:jakarta.servlet.jsp-api:3.1.1'

		api 			'com.fasterxml.jackson.core:jackson-databind:2.8.11.1'
		api         	'com.fasterxml.jackson.core:jackson-annotations:2.7.5'
        api         	'org.apache.httpcomponents:httpclient:4.5.1'
        api         	'commons-io:commons-io:2.4'
        api         	'ch.qos.logback:logback-classic:1.1.3'
		api         	'com.netflix.hystrix:hystrix-core:1.5.9'
		api         	'com.netflix.hystrix:hystrix-metrics-event-stream:1.5.9'
		api         	'com.netflix.hystrix:hystrix-serialization:1.5.9' // provides com.netflix.hystrix.serial.SerialHystrixDashboardData (not pulled transitively)
        api         	'net.sf.ehcache:ehcache:2.10.0'
        api         	'com.google.code.gson:gson:2.5'
        api         	'org.apache.lucene:lucene-core:8.11.2'
        api         	'org.apache.lucene:lucene-queryparser:8.11.2'
        api         	'com.typesafe:config:1.3.0'

        testImplementation     'junit:junit:4.12'
        testImplementation     'com.squareup.okhttp:okhttp:2.5.0'
        testImplementation     'org.mockito:mockito-core:4.11.0'
    }

    test {
        // FCConfig is a JVM-global singleton initialized once on first touch, and several core
        // tests (L1L2 cache tests, FileBasedFallbackResolverTest) trigger that init. Without a
        // valid frontcache.home the init throws and poisons FCConfig for the rest of the JVM
        // (NoClassDefFoundError), making the failure depend on test-execution order. Pin a minimal
        // fixture home so init always succeeds regardless of which test runs first.
        systemProperty 'frontcache.home', "${projectDir}/src/test/resources/fallback-home"
    }
}


project(':frontcache-agent') {
	dependencies {
        api         'org.apache.httpcomponents:httpclient:4.5.1'
	}
}



project(':frontcache-server') {
	apply plugin: 'war'

	dependencies {
		implementation project(':frontcache-core')

		// Embedded Jetty 12 (EE10) for the standalone `appRun` task. Kept in the
		// 'provided' configuration so these jars are NOT bundled into the
		// deployable ROOT.war (it deploys to an external EE10 container), but are
		// on the compile & appRun classpaths.
		provided "org.eclipse.jetty.ee10:jetty-ee10-webapp:${jettyVersion}"
		provided "org.eclipse.jetty.ee10:jetty-ee10-annotations:${jettyVersion}"
		provided "org.eclipse.jetty.ee10:jetty-ee10-apache-jsp:${jettyVersion}"
		provided "org.eclipse.jetty.ee10:jetty-ee10-glassfish-jstl:${jettyVersion}"
	}

	task copyWar(type: Copy) {
		  from tasks.named('war')
		  into 'server/frontcache-base/webapps'
		  rename '(.*).war', 'ROOT.war'
	}
	build.finalizedBy(copyWar)

	// Assemble the standalone launcher's runtime classpath into server/lib. The
	// remote deployment runs `java -cp "server/lib/*" org.frontcache.server.FrontcacheJettyServer`
	// (see server/bin/frontcache) — the modern embedded-Jetty-12 replacement for the
	// old Jetty 9.4 start.jar distribution. The launcher only needs the Jetty EE10
	// jars (in 'provided', deliberately kept out of the war) plus its own class; the
	// war carries frontcache-core + its deps in WEB-INF/lib, so they stay out of here.
	task copyServerLibs(type: Sync) {
		from configurations.provided
		from tasks.named('jar')
		into 'server/lib'
	}
	build.finalizedBy(copyServerLibs)

	// Run Frontcache standalone on embedded Jetty 12 (replaces the gretty appRun).
	task appRun(type: JavaExec) {
		group = 'application'
		description = 'Run Frontcache standalone on embedded Jetty 12'
		mainClass = 'org.frontcache.server.FrontcacheJettyServer'
		classpath = sourceSets.main.runtimeClasspath + configurations.provided
		systemProperty 'frontcache.jetty.port', '9080'
		systemProperty 'frontcache.jetty.webapp', "${projectDir}/src/main/webapp"
		systemProperty 'frontcache.home', "${projectDir}/FRONTCACHE_HOME"
		systemProperty 'org.frontcache.console.config', "${projectDir}/FRONTCACHE_HOME/conf/frontcache-console.conf"
		systemProperty 'logback.configurationFile', "${projectDir}/FRONTCACHE_HOME/conf/fc-logback.xml"
	}
}


project(':frontcache-console') {
	apply plugin: 'war'

	ext {
		springVersion = '6.1.14' // Spring 6 = first jakarta-native line; requires Java 17
	}

	dependencies {
		implementation project(':frontcache-core')
		implementation "org.springframework:spring-context:${springVersion}"
		implementation "org.springframework:spring-webmvc:${springVersion}"
		implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1' // Jakarta JSTL impl (was jstl:jstl:1.2)
		implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0'
		implementation 'com.typesafe:config:1.3.0'
		// Spring 6.1's WebMVC (RouterFunctionMapping) needs Jackson >= 2.13; the
		// transitive 2.8.11.1 pulled in via frontcache-core/Hystrix lacks classes
		// like InvalidDefinitionException. Pin a compatible line for the console.
		implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

		testImplementation "org.springframework:spring-test:${springVersion}"
		testImplementation 'org.mockito:mockito-core:4.11.0'
        provided 'jakarta.servlet:jakarta.servlet-api:6.0.0'

		// Embedded Jetty 12 (EE10) for the standalone `appRun` task, needed to
		// compile+run the local ConsoleJettyServer launcher. In 'provided' so
		// these jars stay out of the deployable frontcache-console.war (it
		// deploys to an external EE10 container).
		provided "org.eclipse.jetty.ee10:jetty-ee10-webapp:${jettyVersion}"
		provided "org.eclipse.jetty.ee10:jetty-ee10-annotations:${jettyVersion}"
		provided "org.eclipse.jetty.ee10:jetty-ee10-apache-jsp:${jettyVersion}"
		provided "org.eclipse.jetty.ee10:jetty-ee10-glassfish-jstl:${jettyVersion}"
	}

	// Run the console standalone on embedded Jetty 12 (replaces the gretty jettyRun).
	// Self-contained: uses this module's own ConsoleJettyServer launcher. Reuses the
	// complete FRONTCACHE_HOME under frontcache-server (holds frontcache-console.conf
	// + fc-logback.xml) so the console has a valid frontcache.home to boot against.
	task appRun(type: JavaExec) {
		group = 'application'
		description = 'Run the Frontcache console on embedded Jetty 12'
		mainClass = 'org.frontcache.console.ConsoleJettyServer'
		classpath = sourceSets.main.runtimeClasspath + configurations.provided
		systemProperty 'frontcache.jetty.port', '7080'
		systemProperty 'frontcache.jetty.webapp', "${projectDir}/src/main/webapp"
		// Console logging: only ERROR+ goes to stdout (see config/fc-logback.xml).
		systemProperty 'logback.configurationFile', "${projectDir}/config/fc-logback.xml"
	}
}



// tests -> FC standalone (localhost:9080) -> FC webfilter (localhost:8080) -> web app (localhost:8080)
// Both FC standalone (:9080, serving src/test-integration/webapp) and FC webfilter
// + web app (:8080, serving src/main/webapp) now run in embedded Jetty 12 via the
// org.frontcache.tests.FrontcacheStandaloneServer launcher. tests.sh starts both,
// runs the integration suite, then kills them. (Was: gretty jetty9.4.)
project(':frontcache-tests') {
	apply plugin: 'war'

	sourceSets {
		integrationTest {
			java.srcDir file('src/test-integration/java')
			resources.srcDir file('src/test-integration/resources')
			compileClasspath = sourceSets.main.output + configurations.testRuntimeClasspath + configurations.provided
			runtimeClasspath = output + compileClasspath
		}
	}

	task integrationTest(type: Test) {
		description = 'Runs the integration tests.'
		group = 'verification'
		maxParallelForks = 1 // run all tests sequentially (due to cache cleanup befor every test)
		forkEvery = 1 // run all tests sequentially (due to cache cleanup befor every test)
		testClassesDirs = sourceSets.integrationTest.output.classesDirs
		classpath = sourceSets.integrationTest.runtimeClasspath
		reports.html.outputLocation = layout.buildDirectory.dir('reports/tests/integration')
		reports.junitXml.outputLocation = layout.buildDirectory.dir('test-results/integration')

		//		jvmArgs = ['-Dfrontcache-tests.home=' + projectDir, '-Xdebug', '-Xrunjdwp:transport=dt_socket,server=y,suspend=y,address=8003']
		jvmArgs '-Dfrontcache-tests.home=' + projectDir
	}

	// FC standalone (:9080) — embedded Jetty 12 serving the reverse-proxy webapp
	task standaloneJetty(type: JavaExec) {
		mainClass = 'org.frontcache.tests.FrontcacheStandaloneServer'
		classpath = sourceSets.main.runtimeClasspath + configurations.provided
		systemProperty 'frontcache.jetty.webapp', "${projectDir}/src/test-integration/webapp"
		systemProperty 'frontcache.jetty.port', '9080'
		systemProperty 'frontcache.home', "${projectDir}/FRONTCACHE_HOME_STANDALONE"
		systemProperty 'logback.configurationFile', "${projectDir}/FRONTCACHE_HOME_STANDALONE/conf/fc-logback.xml"
	}

	// FC webfilter + web app (:8080) — embedded Jetty 12 serving the main webapp (was gretty)
	task webfilterJetty(type: JavaExec) {
		mainClass = 'org.frontcache.tests.FrontcacheStandaloneServer'
		classpath = sourceSets.main.runtimeClasspath + configurations.provided
		systemProperty 'frontcache.jetty.webapp', "${projectDir}/src/main/webapp"
		systemProperty 'frontcache.jetty.port', '8080'
		systemProperty 'frontcache.home', "${projectDir}/FRONTCACHE_HOME_FILTER"
		systemProperty 'logback.configurationFile', "${projectDir}/FRONTCACHE_HOME_FILTER/conf/fc-logback.xml"
	}

	task startStandaloneFrontcache(type: ExecWait) {
		command './gradlew :frontcache-tests:standaloneJetty'
		ready 'has been started successfully'
		directory '.'
	}

	task startWebfilterFrontcache(type: ExecWait) {
		command './gradlew :frontcache-tests:webfilterJetty'
		ready 'has been started successfully'
		directory '.'
	}

	task end2endTests {
		dependsOn integrationTest
	}

	dependencies {
		implementation project(':frontcache-core')
		implementation project(':frontcache-agent')

		// HtmlUnit 2.18 drags in Jetty 9.2 (WebSocket client) which collides with
		// the embedded Jetty 12 launcher. The tests fetch plain HTML/JSP (no
		// WebSocket), so exclude the stale Jetty transitive deps.
		implementation('net.sourceforge.htmlunit:htmlunit:2.18') {
			exclude group: 'org.eclipse.jetty'
			exclude group: 'org.eclipse.jetty.websocket'
		}
		// JSTL for the test JSP pages. Served from the exploded webapp dir (empty
		// WEB-INF/lib), so it must be on the launcher's runtime classpath.
		implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'
		implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.0'

		// Embedded Jetty 12 launcher deps (compile + launcher runtime; not bundled in the war)
		provided "org.eclipse.jetty.ee10:jetty-ee10-webapp:${jettyVersion}"
		provided "org.eclipse.jetty.ee10:jetty-ee10-annotations:${jettyVersion}"
		provided "org.eclipse.jetty.ee10:jetty-ee10-apache-jsp:${jettyVersion}"
		provided "org.eclipse.jetty.ee10:jetty-ee10-glassfish-jstl:${jettyVersion}"

		provided 'junit:junit:4.12'
	}

}
