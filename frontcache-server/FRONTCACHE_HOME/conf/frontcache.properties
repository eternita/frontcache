############# FrontCache Configuration ###################

# front-cache.http-port and front-cache.https-port are important to handle redirects
front-cache.http-port=80
front-cache.https-port=443

#front-cache.debug-comments=false

# THIS SITE'S PUBLIC HOSTNAME - what a visitor types, not what this node calls itself.
#
# It is what Frontcache PUTS IN a URL it hands to a client: guard-rule ${url} / ${url:enc} /
# ${host}, and the host it substitutes into a Location the origin sent. A node is reachable under
# several names - the CDN's, an internal alias, its own hostname, a bare IP - and before this was
# wired up, whichever one a request happened to arrive under is what ended up in the browser's
# address bar. See docs/guard-redirect-url-host-fix.md.
#
# It is ALSO an allowed redirect target (no need to repeat it in
# front-cache.guard-rules.allowed-redirect-hosts), the domain column of the request log, and the
# resilience command group key. It is NOT how a request is matched: guard 'host~' and 'host:ip'
# predicates read the Host that actually arrived, which is the opposite question.
#
# To tell nodes apart in the logs use front-cache.id (conf/frontcache.id), which is per node and is
# already a column of every log line. Leave this unset and emitted URLs fall back to echoing the
# incoming Host, as they did before 2.9.0.
front-cache.default-domain=www.example.com

# The scheme this site is served on publicly. Only needed when Frontcache cannot work it out from
# the request, which is the usual case behind a TLS-terminating proxy: nginx accepts https and
# proxies to a plaintext port, so request.getScheme() says "http" and an emitted URL says
# http://www.example.com/... for an https-only site.
#
# Resolution order: this property, then X-Forwarded-Proto (honoured ONLY from a peer listed in
# front-cache.client-ip.trusted-proxies - a client that could set it could choose the scheme of a
# URL we vouch for), then the incoming connection. Set this when there is no trusted-proxy list.
#front-cache.public-scheme=https

front-cache.origin-host=origin.example.com
#default api-key
front-cache.api-key=your-key-1234-5678-90000

front-cache.origin-http-port=80
# default front-cache.origin-https-port=443

# Send X-Forwarded-Host / X-Forwarded-Proto (naming front-cache.default-domain and the public
# scheme) with every origin call. The origin cannot otherwise know what the visitor typed - the
# client's Host cannot be forwarded, since the connection is to the origin - so an app builds
# absolute URLs naming the origin host.
#
# Default false. Turning it on makes an app with Spring's ForwardedHeaderFilter (or any equivalent)
# change every absolute URL it emits, which is the point of the option and not a thing to switch on
# under a running deployment without checking.
#front-cache.origin.forward-public-host=false

# Security related configs
#
# 'front-cache.api-key' above is the management API's ACCESS CONTROL: a request to the management
# servlet, the dashboard stream or /fc-metrics must carry it as 'Authorization: Bearer <api-key>'.
# Leave it unset only on a node nothing untrusted can reach.
#
# The pre-2.7 'x-frontcache-site-key' header is still accepted, deprecated, so an embedded
# frontcache-agent or an older console keeps working - it will be removed in a later release. The
# HEADER keeps the old spelling on purpose; only the property below was renamed.
#
# This property was called 'front-cache.site-key' through 2.8. The old name is NOT read any more and
# there is no fallback: a config file still saying 'front-cache.site-key' leaves this node with NO
# key, which means the management servlet, the dashboard stream and /fc-metrics are open to anyone
# who can reach a connector. Rename it when you upgrade. The credential on the wire is unchanged, so
# callers (agent, console, peer nodes, Prometheus) need no change of their own.
#
# 'front-cache.management.port' is GONE (removed in 2.9.0). It compared the port the caller ADDRESSED -
# which comes from the Host header, and which a caller therefore controls - so it never restricted
# anyone; the API key above is what does. Restrict which connector answers management traffic in
# your reverse proxy instead.
#
# 'front-cache.management.config-write' (default true) allows the console's Configs screens to write
# this node's conf/resilience.properties, guard-rules.conf, bots.conf, dynamic-urls.conf and
# fallbacks.conf and apply them without a restart.
#
# Set it FALSE when this node's conf/ is deployed from git, Ansible or a container image: an edit made
# through the console would be silently reverted by the next deployment, and the drift is invisible
# until then.
#
# A write also requires 'front-cache.api-key' above to be set. That is stricter than every other
# management action, which an un-keyed node serves openly, and deliberately: an un-keyed node is
# usually un-keyed by accident (an upgrade that left the old 'front-cache.site-key' spelling in this
# file), and remote configuration of how the node handles requests is not what that mistake should
# enable.
#front-cache.management.config-write=false

############# Cache Processor ###################
# the section is to configure 'page fragment caching' implementation

front-cache.cache-processor.impl=org.frontcache.cache.impl.L1L2CacheProcessor

# L2 (Lucene) merge-policy tuning - optional; defaults shown below.
# This is a churn-heavy cache (every re-cache is a delete+add), so segment size is capped to
# keep segments merge-eligible and reclaim deleted docs; leaving these at 5 GB (Lucene default)
# lets one segment grow unbounded and never reclaim its deletes.
# Cap (MB) on the largest merged segment. Default 512.
#front-cache.cache-processor.impl.l2.max-merged-segment-mb=512
# % deleted docs tolerated before merges reclaim them (Lucene allows 20..50). Default 20.
#front-cache.cache-processor.impl.l2.deletes-pct-allowed=20

# L2 (Lucene) commit / visibility tuning - optional; defaults shown below.
#
# Commit cadence, in ms. A Lucene commit fsyncs every file in the index, so it is a checkpoint
# operation and belongs on a timer - it used to run after EVERY cache write, i.e. one fsync per
# cache miss (two, when an expired entry was refreshed). The cost of deferring it: an ungraceful
# kill loses up to this much of recently cached content, which for a cache is a brief origin
# warm-up rather than data loss. Ordinary shutdown, and the management API's invalidate/purge,
# commit regardless. Set to 0 to restore the old commit-after-every-write behaviour.
#front-cache.cache-processor.impl.l2.commit-interval-ms=10000
#
# Whether a write also refreshes the searcher, making the entry readable by the very next request
# for that URL. Leave it on unless you know you want the alternative: turning it off batches writes
# into fewer, larger segments (easier on the merge policy) but leaves a window in which a popular
# page keeps missing the cache and hitting origin.
#front-cache.cache-processor.impl.l2.refresh-on-write=true
#
# Safety-net refresh cadence, in ms - covers the case of two overlapping writes, where the second
# one's refresh returns immediately because the first is still refreshing. Set to 0 to disable.
#front-cache.cache-processor.impl.l2.refresh-interval-ms=1000

############# Bypass (non-cacheable) requests ###################

# Whether a bypassed response keeps the origin's Content-Encoding. Default false.
#
# Frontcache asks the origin for gzip and lets its HTTP client transparently decompress. On the
# CACHEABLE path that is required - the cached bytes must be plaintext, or the include processor
# cannot scan them and an encoding Frontcache cannot decode (br, zstd) would be cached and served to
# clients that never asked for it. On the BYPASS path the body is streamed straight through, never
# parsed and never cached, so the only effect is that Frontcache decompresses the response and then
# ships it to the client UNCOMPRESSED - even when the client asked for gzip and the origin was
# willing to send it.
#
# Turning this on forwards the client's own Accept-Encoding and relays the origin's Content-Encoding
# untouched. BEFORE YOU DO: check whether an nginx / CDN in front of Frontcache is compressing
# already. If it is, it is compressing on the assumption that what reaches it is identity, and
# enabling this would have it compress an already-compressed body.
#front-cache.bypass.passthrough-encoding=false

############# Include Processor ###################
# the section is to configure 'page fragment includes' processing implementation
# options - Serial Include Processor or Concurrent Include Processor
# default is SerialIncludeProcessor

#front-cache.include-processor.impl=org.frontcache.include.impl.SerialIncludeProcessor

# Where a cache-MISSING <fc:include> is fetched from.
#
#   origin (default)  fetch front-cache.origin-host directly and cache the answer here.
#   edge              pre-2.9 behaviour: fetch it from this node's own public URL - the Host header.
#                     The request goes back out to the CDN and in at this node's front door, which
#                     fetches the origin and caches the answer on the way back through.
#
# 'origin' removes a hop, a TLS handshake and a request parse per missing include, and takes
# includes off the front door - where they hold an Input-Request permit, occupy a container thread
# and can be rate-limited by whatever proxy sits in front. Watch Include-Request on the dashboard:
# it goes to ~0 when this is working, and that is the whole confirmation.
#
# The cache key does NOT move: an entry is still keyed on the public URL, so switching this does not
# orphan a warm cache and does not create a second key per fragment. 'edge' is kept as an escape
# hatch that needs no code rollback.
#
# FILTER MODE is included, and buys less there: the origin is the app this filter is installed in,
# so the fetch re-enters the filter either way - what changes is that it goes to origin-host
# (normally localhost) instead of out to the CDN and back. To stop the re-entry caching the fragment
# a second time under the address it arrived at, the fetch is marked x-frontcache-dynamic-request;
# this side then owns the single entry, keyed on the public URL. front-cache.origin-host must
# therefore be right in filter mode - it already had to be, since soft invalidation/refresh has
# always used it.
#front-cache.include-fetch-target=origin

#----- start Concurrent Include Processor configs -----
front-cache.include-processor.impl=org.frontcache.include.impl.ConcurrentIncludeProcessor

# amount of threads. default is 1
front-cache.include-processor.impl.concurrent.thread-amount=100

# timeout in ms. default is 5000 (5 sec)
front-cache.include-processor.impl.concurrent.timeout=3000

# --- combine and reduce includes (docs/archive/combine-reduce-proposal.md) ---
#
# Aggregates the cache-MISSING includes of one page into a single origin request, so an origin
# whose data access is batched at page level pays its query cost once instead of once per fragment.
#
# Only ever acts on includes the markup marks:  <fc:include url="..." combine="true" />  - and only
# when the origin implements the endpoint contract (proposal sections 5 and 6). So this switch is a
# kill switch, not an opt-in: leaving it true changes nothing for markup that does not ask.
# default is true
#front-cache.include-processor.impl.concurrent.combine=true

# Members per origin request. A page with 200 combinable includes must not become one 200-member
# call: origin memory, and one slow member holding up all of them. default is 30
#front-cache.include-processor.impl.concurrent.combine.max-batch-size=30

# Second cap, on the encoded query length in characters - batches split on whichever cap is reached
# first. 2000 stays well under every proxy's request-line limit, which fails as a 414 that looks
# like nothing else. default is 2000
#front-cache.include-processor.impl.concurrent.combine.max-url-length=2000

# How long "this origin does not implement combining" is remembered, per endpoint, in ms. Without
# it an origin carrying the attribute but not the handler pays one wasted request per group on
# every page view; with it, one per group per window, and a rolling deploy converges within one
# window. default is 60000
#front-cache.include-processor.impl.concurrent.combine.unsupported-ttl=60000

#----- end Concurrent Include Processor configs -----

# log requests/includes performance stat to HTTP headers. default is false
front-cache.log-to-headers=true

#----- start guard rules (checks before cache & origin) -----
# see conf/guard-rules.conf and docs/frontcache-protection-tech-design.md

# max URL length before 414 URI Too Long (built-in 'uri-too-long' rule; <= 0 disables it)
front-cache.max-request-uri-length=4096

# built-in 'bad-request' rule: 400 for structurally-invalid (amp;-mangled) query params. default true
#front-cache.guard-rules.bad-request.enabled=true

# load the rules from conf/guard-rules.conf. default true.
# false keeps the two built-ins active and drops everything configured.
# Read at STARTUP - for an instant rollback, empty conf/guard-rules.conf and call
# action=reload-guard-rules instead.
#front-cache.guard-rules.enabled=true

# hosts an absolute redirect target may point at, comma-separated. front-cache.default-domain
# is allowed already; this is for anything else. Open-redirect protection: a rule redirecting
# elsewhere is refused at load time, and a host that only appears once ${...} placeholders are
# expanded is caught at request time - the target is skipped, an absolute URL in one of its query
# parameters is rewritten onto front-cache.default-domain (or dropped if there is none).
#front-cache.guard-rules.allowed-redirect-hosts=www.example.com

#----- end guard rules -----

#----- start per-IP rate limiting -----
# THE LIMIT AND THE WINDOW LIVE IN conf/guard-rules.conf, per rule - e.g.
#   ip-flood | rate:100/10s | reject:429 Too Many Requests
# means "100 requests per 10-second slot, per client IP". Keeping them there is what lets them be
# changed with action=reload-guard-rules instead of a restart. Only sizing and the off switch
# are here.

# CIDRs whose forwarding headers Frontcache believes, comma-separated.
#
# READ THIS BEFORE ENABLING A rate: RULE. Frontcache never reads X-Forwarded-For (or any other
# forwarding header) from an untrusted peer, because every one of them is client-supplied: a
# client sending its own X-Forwarded-For would otherwise mint a fresh counter per request and
# defeat the limiter entirely. So with this EMPTY, the limiter keys on the socket peer - and in
# the documented deployment (TLS terminated upstream, proxied to 127.0.0.1) that is 127.0.0.1
# for every visitor, i.e. the whole site counted as one client. Frontcache WARNs at startup when
# a rate: rule is loaded and this is empty.
#
# Set it to the address of whatever actually terminates the client connection - the local nginx,
# your CDN's egress ranges, sibling Frontcache nodes.
#front-cache.client-ip.trusted-proxies=127.0.0.1/32,::1/128,10.0.0.0/8

# forwarding header read from a trusted peer. It is walked RIGHT TO LEFT, returning the first
# entry that is not itself a trusted proxy: the leftmost entry is whatever the client wrote, the
# rightmost non-trusted one is what the last proxy we trust actually observed.
#front-cache.client-ip.header=X-Forwarded-For

# One address is one counter. There is no prefix/subnet grouping, deliberately: a shared-NAT
# office or a CGNAT pool is never limited because of one user behind it. The cost is that an IPv6
# client holding a /64 can rotate addresses and evade the limit - see
# docs/archive/guard-rate-limit-proposal.md section 12.

# Slots per rate-limit bucket (one bucket per rule, unless rules share one with bucket=<name>),
# rounded up to a power of two. 8 bytes each, so the default is 2 MB. Undersizing costs accuracy,
# never false rejections - watch the takeover count.
#front-cache.guard-rules.rate-limit.slots=262144

# Ceiling across all buckets. A rule that would push past it is skipped with an error rather than
# the node running out of heap. Default 4194304 (32 MB).
#front-cache.guard-rules.rate-limit.max-total-slots=4194304

# Emergency off switch: every rate: predicate returns false, rules stay loaded and visible in the
# console. A property, so it applies at the next restart - the restart-free rollback is to comment
# the rule out and call action=reload-guard-rules.
#front-cache.guard-rules.rate-limit.enabled=true
#----- end per-IP rate limiting -----

#----- start bot classification -----
# Which requests are classified 'bot' rather than 'guest'. The rules live in conf/bots.conf and are
# reloaded with action=reload-bots; only the two switches below are properties.
# See docs/dynamic-bots-classification-proposal.md.
#
# The client type is not a judgement about the client - it selects a behaviour profile: which branch
# of a response's maxage applies (so a different TTL, or an origin call instead of the cache) and
# whether an <fc:include client="..."/> fragment is resolved. Guard rules can read it back through
# their client-type: predicate, but that is one consumer among several.
#
# A client-ip: rule in bots.conf needs front-cache.client-ip.trusted-proxies above, for exactly the
# reason the rate limiter does: without it only the socket peer is visible, and a client that could
# be believed about its own address could put itself inside any block the file names.
#
# trusted-proxies also switches on client-type propagation to <fc:include> fragments: the node
# serving the page sends X-Frontcache-Client-Type on the include fetch, and the receiving node
# adopts it instead of classifying the fragment on its own (different) evidence - but only from a
# trusted peer, and only on a request that arrived as an include. With this empty the propagation is
# simply off and every request is classified on its own, which is why a cookie:/client-ip: rule
# should carry 'request-type:toplevel' until you set it. If the proxy you trust passes client
# headers through verbatim (nginx does), have it strip X-Frontcache-Client-Type.

# load the rules from conf/bots.conf. default true.
# false falls back to bare User-Agent keywords only (the pre-2.9.0 behaviour); the built-ins stay.
#front-cache.bots.rules.enabled=true

# a request with no User-Agent header at all is a bot. default true (the pre-2.9.0 hard-coded rule).
# Set false where a health checker or an internal client legitimately sends none.
#front-cache.bots.empty-user-agent-is-bot=true
#----- end bot classification -----

#----- start HTTP client (origin calls) connection pool configs -----
# All the threads that call the origin share this pool: the OriginPool
# (resilience.threadpool.OriginPool.coreSize in resilience.properties) plus
# front-cache.include-processor.impl.concurrent.thread-amount above. Practically all traffic goes to
# one origin, i.e. ONE route, so keep max-per-route >= the sum of those two - otherwise the surplus
# threads simply queue for a connection under load. Watch for
# "HTTP connection pool is close to exhaustion" in the log.

# total connections across all origins. default is 400
#front-cache.http-client.connections-max-total=400

# connections to a single origin. default is the value of connections-max-total
#front-cache.http-client.connections-max-per-route=400

# how long (ms) a thread waits for a free connection before failing over to the fallback.
# default is 2000. 0 means wait forever - do not use, it turns a shortage into a thread pile-up
#front-cache.http-client.connection-request-timeout=2000

# origin socket read timeout (ms). default is 10000
# keep it BELOW the command timeouts so a slow origin is ended by the HTTP client (which releases
# the connection) rather than by the command timeout (which cannot interrupt a blocking socket read)
#front-cache.http-client.socket-timeout=10000

# origin connect timeout (ms). default is 5000
#front-cache.http-client.connect-timeout=5000
#----- end HTTP client (origin calls) connection pool configs -----

#----- metrics export (Prometheus / OTLP) -----
# Exports the same numbers the dashboard stream shows, through Micrometer. Additive: the SSE
# stream and the console are unaffected either way.
#
#   none        (default) nothing is exported, no listener, no push loop
#   prometheus  serve a scrape endpoint at /fc-metrics
#   otlp        push to an OTLP collector (needs the url below)
#   both
#
# /fc-metrics requires this node's front-cache.api-key as 'Authorization: Bearer <api-key>' whenever
# one is configured - it exposes traffic volumes, error rates, circuit state and command names. In
# Prometheus that is authorization.credentials in the scrape_config. If you use guard rules, allow it:
# Frontcache warns at startup when a rule would block /fc-metrics.
#
# What is exported: per-command outcomes and latency percentiles, circuit-breaker/bulkhead state, thread
# pool occupancy and rejections, the CACHE - reads split by hit/miss and by tier (L1 memory, L2 disk),
# entries and on-disk bytes per tier, and L1 evictions - and the GUARD RULES: one counter per rule,
# labelled by rule name and by what it did (rejected / redirected / dry-run / allowed), plus a
# rate-limit slot-takeover counter per bucket. A dry-run rule's counter is how you size a new limit
#   sum(rate(frontcache_guard_actions_total{result="dry-run"}[5m])) by (name)
# before letting it act, and a takeover count rising with traffic means
# front-cache.guard-rules.rate-limit.slots is too small. Cache hit ratio is
#   sum(rate(frontcache_cache_reads_total{result="hit"}[5m])) / sum(rate(frontcache_cache_reads_total[5m]))
# and a high ratio served mostly from tier="L2" means L1 is too small for the working set.
#
# Series are named frontcache_* and labelled by a fixed, small set of keys: command, event, quantile,
# pool, name, kind, state, result, tier. Nothing is labelled by URL - on a page cache the URL space is
# unbounded, so a per-URL label is a cardinality explosion.
#front-cache.metrics.export=none

# OTLP collector endpoint. Required for otlp/both; export stays off without it rather than logging a
# failure every step.
#front-cache.metrics.otlp.url=http://localhost:4318/v1/metrics

# how often to push. default 60s
#front-cache.metrics.otlp.step=60s

# extra headers, header=value,header2=value2 - usually the collector auth token. Values are never logged.
#front-cache.metrics.otlp.headers=
#----- end metrics export -----
