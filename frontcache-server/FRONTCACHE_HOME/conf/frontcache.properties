############# FrontCache Configuration ###################

# front-cache.http-port and front-cache.https-port are important to handle redirects
front-cache.http-port=80
front-cache.https-port=443

#front-cache.debug-comments=false
front-cache.default-domain=www.example.com
front-cache.origin-host=origin.example.com
#default site-key
front-cache.site-key=your-key-1234-5678-90000

front-cache.origin-http-port=80
# default front-cache.origin-https-port=443

# Security related configs
#
# Frontcache management servlet can accept commands from port specified in 'front-cache.management.port' only
# If 'front-cache.management.port' is commented out - Frontcache management servlet accepts connections from all connectors
#
# This property for security consideration - you can enable separate port and restrict that port with firewall
#
front-cache.management.port=443

############# Cache Processor ###################
# the section is to configure 'page fragment caching' implementation

front-cache.cache-processor.impl=org.frontcache.cache.impl.L1L2CacheProcessor

# L2 (Lucene) merge-policy tuning - optional; defaults shown below.
# This is a churn-heavy cache (every re-cache is a delete+add), so segment size is capped to
# keep segments merge-eligible and reclaim deleted docs; leaving these at 5 GB (Lucene default)
# lets one segment grow unbounded and never reclaim its deletes.
# Cap (MB) on the largest merged segment. Default 512.
#front-cache.cache-processor.impl.l2.max-merged-segment-mb=512
# % deleted docs tolerated before merges reclaim them (Lucene allows 20..50). Default 20.
#front-cache.cache-processor.impl.l2.deletes-pct-allowed=20

############# Include Processor ###################
# the section is to configure 'page fragment includes' processing implementation
# options - Serial Include Processor or Concurrent Include Processor
# default is SerialIncludeProcessor

#front-cache.include-processor.impl=org.frontcache.include.impl.SerialIncludeProcessor

#----- start Concurrent Include Processor configs -----
front-cache.include-processor.impl=org.frontcache.include.impl.ConcurrentIncludeProcessor

# amount of threads. default is 1
front-cache.include-processor.impl.concurrent.thread-amount=100

# timeout in ms. default is 5000 (5 sec)
front-cache.include-processor.impl.concurrent.timeout=3000

#----- end Concurrent Include Processor configs -----

# log requests/includes performance stat to HTTP headers. default is false
front-cache.log-to-headers=true

#----- start guard rules (checks before cache & origin) -----
# see conf/guard-rules.conf and docs/frontcache-protection-tech-design.md

# max URL length before 414 URI Too Long (built-in 'uri-too-long' rule; <= 0 disables it)
front-cache.max-request-uri-length=4096

# built-in 'bad-request' rule: 400 for structurally-invalid (amp;-mangled) query params. default true
#front-cache.guard-rules.bad-request.enabled=true

# load the rules from conf/guard-rules.conf. default true.
# false keeps the two built-ins active and drops everything configured.
# Read at STARTUP - for an instant rollback, empty conf/guard-rules.conf and call
# action=reload-guard-rules instead.
#front-cache.guard-rules.enabled=true

# hosts an absolute redirect target may point at, comma-separated. front-cache.default-domain
# is allowed already; this is for anything else. Open-redirect protection: a rule redirecting
# elsewhere is refused at load time.
#front-cache.guard-rules.allowed-redirect-hosts=www.example.com

#----- end guard rules -----

#----- start HTTP client (origin calls) connection pool configs -----
# All the threads that call the origin share this pool: the Hystrix OriginHitsPool
# (hystrix.threadpool.OriginHitsPool.coreSize in hystrix.conf) plus
# front-cache.include-processor.impl.concurrent.thread-amount above. Practically all traffic goes to
# one origin, i.e. ONE route, so keep max-per-route >= the sum of those two - otherwise the surplus
# threads simply queue for a connection under load. Watch for
# "HTTP connection pool is close to exhaustion" in the log.

# total connections across all origins. default is 400
#front-cache.http-client.connections-max-total=400

# connections to a single origin. default is the value of connections-max-total
#front-cache.http-client.connections-max-per-route=400

# how long (ms) a thread waits for a free connection before failing over to the fallback.
# default is 2000. 0 means wait forever - do not use, it turns a shortage into a thread pile-up
#front-cache.http-client.connection-request-timeout=2000

# origin socket read timeout (ms). default is 10000
# keep it BELOW the Hystrix command timeouts so a slow origin is ended by the HTTP client (which
# releases the connection) rather than by Hystrix (which cannot interrupt a blocking socket read)
#front-cache.http-client.socket-timeout=10000

# origin connect timeout (ms). default is 5000
#front-cache.http-client.connect-timeout=5000
#----- end HTTP client (origin calls) connection pool configs -----

#----- metrics export (Prometheus / OTLP) -----
# Exports the same numbers the /hystrix.stream dashboard shows, through Micrometer. Additive: the SSE
# stream and the console are unaffected either way.
#
#   none        (default) nothing is exported, no listener, no push loop
#   prometheus  serve a scrape endpoint at /fc-metrics
#   otlp        push to an OTLP collector (needs the url below)
#   both
#
# /fc-metrics answers only on front-cache.management.port when that is set - it exposes traffic volumes,
# error rates, circuit state and command names, and a scrape endpoint is unauthenticated by convention,
# so the connector IS the access control. If you use guard rules, allow it: Frontcache warns at startup
# when a rule would block /fc-metrics.
#
# Series are named frontcache_* and labelled by command key and event only. Nothing is labelled by URL -
# on a page cache the URL space is unbounded, so a per-URL label is a cardinality explosion.
#front-cache.metrics.export=none

# OTLP collector endpoint. Required for otlp/both; export stays off without it rather than logging a
# failure every step.
#front-cache.metrics.otlp.url=http://localhost:4318/v1/metrics

# how often to push. default 60s
#front-cache.metrics.otlp.step=60s

# extra headers, header=value,header2=value2 - usually the collector auth token. Values are never logged.
#front-cache.metrics.otlp.headers=
#----- end metrics export -----
