# Bot classification - decides whether a request's client type is 'bot' or 'guest'.
# Design / internals: docs/dynamic-bots-classification-proposal.md
#
# WHAT THE CLIENT TYPE IS FOR
#   It is NOT a verdict about the client, and nothing here rewards or punishes anyone. It selects a
#   BEHAVIOUR PROFILE, chosen per URL by whoever writes the page:
#     - a different TTL            maxage="bot:30d"  vs  maxage="guest:5m"
#     - cache vs an origin call    a client type with no max-age always reaches the origin
#     - whether a fragment is resolved at all   <fc:include client="guest" .../>
#     - and, as ONE consumer among several, guard rules, via their client-type: predicate.
#   So the question a rule answers is "should this client get the cached page or a fresh one?",
#   not "is this client welcome?".
#
#   Only 'bot' and 'guest' exist, and no third value can be added: the client type keys the max-age
#   map of every response already stored in the L2 index, so a new value would leave every existing
#   entry without a key for it - and an entry with no key for the current client type is never
#   served and never re-cached.
#
# TWO LINE FORMATS
#
#   1) A bare line is a User-Agent substring, CASE-INSENSITIVE (it was case-sensitive before 2.10,
#      which meant a file listing 'Googlebot' did not match 'googlebot/2.1'):
#
#        bingbot
#
#   2) A rule, in the same format as guard-rules.conf:
#
#        <name> | <predicate> ; <predicate> ... | <bot|guest> [| dry-run]
#
#      name       short slug. It is what the console's Bot Config screen shows and what its hit
#                 counter is attributed to, so renaming a rule restarts its count.
#      predicate  AND-ed, ';'-separated. Prefix with '!' to negate:
#                   ua~<regex>              User-Agent (java.util.regex, find(); (?i) for any case)
#                   ua-contains:<text>      User-Agent substring, case-insensitive
#                   client-ip:<cidr|list>   client address in a block: 66.249.64.0/19, or several
#                                           comma-separated, or @file naming a list under conf/
#                                           (one address or CIDR per line, '#' comments)
#                   cookie:<name>           cookie present (presence only - values are never read)
#                   header:<name>[~<regex>] header present / matching
#                   uri~<regex>             request URI (no query string)
#                   query~<regex>           query string (leading '?' included)
#                   url~<regex>             scheme + host + URI + query
#                   host~<regex> / host:ip  the Host the request arrived under
#                   method:<GET|POST|...>   HTTP method
#                   request-type:<toplevel|include|include-async>
#                                           toplevel = a request from a client; the others are
#                                           <fc:include> fragments re-entering the engine
#                 NOT available here, both refused at load time with an explanation:
#                   client-type:  circular - this file is what computes the client type
#                   rate:         it counts, and classification runs for every request INCLUDING
#                                 every include, so it would spend a visitor's budget once per
#                                 fragment of their page. Put the rate rule in guard-rules.conf and
#                                 select on client-type: there.
#      dry-run    evaluate and count, but do not apply. ALWAYS ship a new rule this way first and
#                 watch its hit count before letting it decide anything.
#
# ORDER
#   Top to bottom, FIRST MATCH WINS, and only the rule that DECIDES counts a hit. A 'guest' rule
#   placed above a 'bot' rule is therefore an exemption. Full order:
#     1. built-in  no-user-agent | !header:User-Agent | bot   (front-cache.bots.empty-user-agent-is-bot=false to drop it)
#     2. the rules below, in file order
#     3. the bare keywords below, in file order  - so an explicit rule always wins over a keyword
#     4. built-in  default | (always) | guest
#
# INCLUDES
#   An <fc:include> that re-enters Frontcache is a separate request and would be classified on its
#   own evidence - which is not the page's evidence: its socket peer is the sibling node, and an
#   async include is resolved after the servlet request was recycled, so it may see no cookies at
#   all. Page and fragment would then read different branches of the same max-age map, and the
#   fragments would quietly stop being cached.
#   The node serving the page therefore sends its decision on the include fetch, as
#   X-Frontcache-Client-Type, and the receiving node adopts it INSTEAD of classifying - but only
#   from a peer in front-cache.client-ip.trusted-proxies, and only on a request that arrived as an
#   include. With no trusted proxies configured (the default) nothing is ever adopted, so keep
#   'request-type:toplevel' in any rule that reads cookies or the client IP.
#   If your proxy passes client headers through verbatim (nginx does), have it STRIP
#   X-Frontcache-Client-Type - as it should already be stripping X-Frontcache-Client-IP.
#   Adopted requests are decided before the rules run, so no rule counts a hit for them: the Hits
#   column counts decisions about visitors, not requests.
#
# client-ip: NEEDS front-cache.client-ip.trusted-proxies
#   Without it only the socket peer is visible and every forwarding header is ignored - correct only
#   if clients connect to this node directly. Behind nginx or a CDN the rule would see the proxy's
#   address for every request. The node WARNs at startup if a client-ip: rule is loaded without it.
#   Never match on FCUtils' best-effort client IP instead: it believes thirteen client-supplied
#   headers, so a client could put itself inside any block named here just by sending one.
#
# SAFETY
#   A line that fails to parse - bad regex, unknown predicate, unparseable CIDR, a missing @file - is
#   skipped with an ERROR in the log; every other line keeps working.
#
# Reload after editing: restart, or call the management servlet:
#   curl -H "Authorization: Bearer <key>" "http://<edge>/frontcache-io?action=reload-bots"
# Inspect what a node is running, with per-rule hit counts:
#   curl -H "Authorization: Bearer <key>" "http://<edge>/frontcache-io?action=get-bots"
# ...or open the console's "Bot Config" screen, which shows the same per edge.


# --- rules (all commented out: no configured rules ship enabled by default) ----------------

# A partner or monitoring source that must always be treated as a normal visitor. Exemptions go
# ABOVE the rules they exempt from.
#partner-feed   | client-ip:203.0.113.7                            | guest

# Headless browsers announce themselves; real ones do not.
#headless       | ua~(?i)(headlesschrome|phantomjs|puppeteer)      | bot

# Something claiming to be Googlebot from outside Google's published ranges is not Googlebot.
# Needs conf/bot-networks/googlebot.txt - one CIDR per line, regenerated by a cron job from the
# ranges Google publishes.
#fake-googlebot | ua~(?i)googlebot ; !client-ip:@bot-networks/googlebot.txt | bot

# No proof a browser ran: 'hruc' is set by the page's own JavaScript.
# THREE THINGS BEFORE COPYING THIS:
#  1. a first-time human visitor has no cookies either, so their first page view is 'bot' - which is
#     good if 'bot' means "gets the 30-day cached page" and bad if a guard rule then rejects them;
#  2. request-type:toplevel is not optional - an include may not carry the visitor's cookies, and
#     without it a normal visitor's fragments flip client type independently of their page;
#  3. it means nothing unless 'hruc' is set by JavaScript. A cookie set by a Set-Cookie header is
#     kept by any HTTP client with a cookie jar, which most scrapers have.
#no-js-proof    | request-type:toplevel ; method:GET ; !cookie:hruc | bot | dry-run


# --- bare User-Agent keywords -------------------------------------------------------------
# Matched case-insensitively as a substring of the User-Agent header.

Googlebot
msnbot
bingbot
