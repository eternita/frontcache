# Guard rules - checks that run BEFORE cache and origin, for every request.
# See docs/frontcache-protection-tech-design.md
#
# FORMAT
#   <name> | <predicate> ; <predicate> ... | <action> [| dry-run]
#
#   name       short slug. It is written to frontcache-failed-requests.log as the reason and
#              becomes the metric in the Kibana "Frontcache Rejected Requests" dashboard, so
#              renaming a rule renames the metric.
#   predicate  AND-ed, ';'-separated. Prefix with '!' to negate:
#                host:ip                 Host is an IP literal (v4/v6), not a name
#                host~<regex>            server name
#                uri~<regex>             request URI (no query string)
#                query~<regex>           query string (leading '?' included)
#                url~<regex>             scheme + host + URI + query
#                method:<GET|POST|...>   HTTP method
#                client-type:<bot|browser>   from bots.conf
#                cookie:<name>           cookie present (presence only - values are never read)
#                header:<name>[~<regex>] header present / matching
#              Regexes are java.util.regex, matched with find() - same as dynamic-urls.conf.
#   action     allow                     stop evaluating, let the request through (exemption)
#              reject:<4xx|5xx> [body]   send status + short text/plain body
#              redirect:<301|302|303|307|308> <target>
#                                        Location + Cache-Control: no-store.
#                                        Target may be relative ('/login.htm') or absolute; an
#                                        absolute host must be listed in front-cache.domains or
#                                        front-cache.guard-rules.allowed-redirect-hosts.
#                                        Placeholders: ${uri} ${query} ${url} ${url:enc} ${host}
#   dry-run    evaluate and log only - the request is untouched. ALWAYS ship a new rule this way
#              first and watch the dashboard before letting it act.
#
# ORDER
#   Rules run top to bottom, FIRST MATCH WINS, after the two built-ins (uri-too-long -> 414,
#   bad-request -> 400). Exemptions are 'allow' rules placed ABOVE the rule they exempt from.
#
# SAFETY
#   A rule that fails to parse - bad regex, unknown predicate, redirect to an unlisted host, a
#   redirect target its own condition matches (infinite loop) - is skipped with an ERROR in the
#   log; the other rules keep working. Frontcache also WARNs at startup if a rule would block
#   /fc-ping.jsp (GSLB health check) or /frontcache/ (agent, console, replication).
#
# Reload after editing: restart, or POST action=reload to the management servlet.
#
# Everything below is commented out: no configured rules ship enabled by default.


# --- exemptions: keep these ABOVE any rule that could match them --------------------------
#ping-by-ip     | uri~^/fc-ping\.jsp$   | allow
#mgmt-by-ip     | uri~^/frontcache/     | allow
#login-page     | uri~^/login\.htm      | allow

# --- scanners hitting the node by IP instead of by name -----------------------------------
# Saves the cache lookup and origin call for traffic that is never a real visitor.
#ip-access      | host:ip               | redirect:301 https://www.example.com/en/welcome.htm

# --- anonymous visitors on account-only pages ---------------------------------------------
# No session cookie -> origin would render a page whose only outcome is "go log in".
# 302 (not 301): the decision depends on a cookie and must be re-made on every visit.
#anon-analytics | uri~^/[a-z]{2}/ccc/va/ ; !cookie:hruc | redirect:302 https://www.example.com/login.htm?return=${url:enc}
