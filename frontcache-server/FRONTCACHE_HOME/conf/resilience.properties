# Circuit-breaker, timeout, bulkhead and thread-pool settings, read by FcResilienceConfig.
#
# Keys are resilience.command.<command-key>.<property> and resilience.threadpool.<pool>.<property>,
# resolved as: this command key, then "default", then the built-in default. The pre-2.7 hystrix.*
# spelling of every key below is still accepted, so a file carried over from an older install keeps
# working - the FILE NAME is the part that changed (conf/hystrix.properties is read for one release
# more, with a warning). The property names themselves are unchanged; they outlived the library.
#
# Command keys are the FC_* commands: Input-Requests, Include-Requests, Cache-Hits,
# Cache-Origin-http, Cache-Origin-filter, Origin-Hits.
#
# Should an overdue command be interrupted?
# default: true
resilience.command.default.execution.isolation.thread.interruptOnTimeout=true

# How many errors are allowed before the circuit breaker is activated?
# default: 50 (must be greater than 0,
# 100 means no breaking despite of errors)
resilience.command.default.circuitBreaker.errorThresholdPercentage=50

# How many requests are needed in the time span to trigger the circuit breaker?
# default: 20
resilience.command.default.circuitBreaker.requestVolumeThreshold=50

# After what time (in ms) should the circuit breaker try a single request?
# default: 5000
resilience.command.default.circuitBreaker.sleepWindowInMilliseconds=5000

#resilience.command.default.execution.isolation.strategy=SEMAPHORE
#resilience.command.default.execution.timeout.enabled=true
#resilience.command.default.execution.isolation.thread.timeoutInMilliseconds=10000

resilience.command.Input-Requests.execution.isolation.strategy=SEMAPHORE
resilience.command.Input-Requests.execution.isolation.thread.timeoutInMilliseconds=20000
#default 10
resilience.command.Input-Requests.execution.isolation.semaphore.maxConcurrentRequests=50
#default 10
resilience.command.Input-Requests.fallback.isolation.semaphore.maxConcurrentRequests=50

# Include-Requests is an include arriving back through this node's own front door - which is what a
# cache-missing <fc:include> does, since it is fetched over HTTP against the Host header. It was
# counted as Input-Requests until 2.9, so the dashboard's headline traffic figure included the
# node's own fragment fetches; on one production edge that read 1200/s against ~11/s of real client
# traffic.
#
# It needs no stanza here: a command key with nothing set inherits Input-Requests above, property by
# property, so an existing file needs no edit and includes keep the limits they already had.
#
# Note what the split does change, since a command key owns its own semaphore and circuit breaker:
# includes and client requests now get one each instead of sharing. That is the point - an include
# storm can no longer eat the permits visitor requests need, and a failing include path no longer
# trips the breaker that serves visitors. It does mean total concurrency across the two is the sum,
# so if the inherited number was sized as a hard ceiling on everything, set it explicitly below.
#resilience.command.Include-Requests.execution.isolation.strategy=SEMAPHORE
#resilience.command.Include-Requests.execution.isolation.thread.timeoutInMilliseconds=20000
#resilience.command.Include-Requests.execution.isolation.semaphore.maxConcurrentRequests=50
#resilience.command.Include-Requests.fallback.isolation.semaphore.maxConcurrentRequests=50

resilience.command.Origin-Hits.execution.isolation.strategy=THREAD
resilience.command.Origin-Hits.execution.isolation.thread.timeoutInMilliseconds=20000

resilience.command.Cache-Origin-http.execution.isolation.strategy=THREAD
resilience.command.Cache-Origin-http.execution.isolation.thread.timeoutInMilliseconds=10000

resilience.command.Cache-Origin-filter.execution.isolation.strategy=THREAD
resilience.command.Cache-Origin-filter.execution.isolation.thread.timeoutInMilliseconds=10000

resilience.command.Cache-Hits.execution.isolation.strategy=SEMAPHORE
resilience.command.Cache-Hits.execution.isolation.thread.timeoutInMilliseconds=1500

resilience.threadpool.default.coreSize=100
resilience.threadpool.OriginHitsPool.coreSize=100

resilience.config.stream.maxConcurrentConnections=15
