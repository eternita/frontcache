# Circuit-breaker, timeout, bulkhead and thread-pool settings, read by FcResilienceConfig.
#
# Keys are resilience.command.<command-key>.<property> and resilience.threadpool.<pool>.<property>,
# resolved as: this command key, then "default", then the built-in default. The pre-2.7 hystrix.*
# spelling of every key below is still accepted, so a file carried over from an older install keeps
# working - the FILE NAME is the part that changed, and conf/hystrix.properties is NO LONGER READ as
# of 2.9.0: rename the file, and the keys inside it can stay as they are. The property names
# themselves are unchanged; they outlived the library.
#
# Command keys are the FC_* commands: Input-Request, Include-Request, Cache-Hit, Cache-Miss,
# Cache-Bypass.
#
# Four of those were renamed in 2.9.0, and Cache-Miss is two old keys combined:
#   Input-Requests    -> Input-Request
#   Include-Requests  -> Include-Request
#   Origin-Hits       -> Cache-Bypass
#   Cache-Origin-http | Cache-Origin-filter -> Cache-Miss   (one key, one breaker, one bulkhead)
# Cache-Hits -> Cache-Hit followed, the last key left in the plural; only the spelling moved.
# A file still using the old names KEEPS WORKING: each new key inherits its old name's settings,
# property by property, the same mechanism Include-Request uses. So this is an edit you can make at
# your leisure - but until you do, the dashboard and /fc-metrics show the NEW names while the file
# says the old ones, which is confusing to read. Renaming Cache-Origin-http/-filter is the one that
# needs a thought: they are one key now, so if you tuned them differently, pick a number.
#
# Should an overdue command be interrupted?
# default: true
resilience.command.default.execution.isolation.thread.interruptOnTimeout=true

# How many errors are allowed before the circuit breaker is activated?
# default: 50 (must be greater than 0,
# 100 means no breaking despite of errors)
resilience.command.default.circuitBreaker.errorThresholdPercentage=50

# How many requests are needed in the time span to trigger the circuit breaker?
# default: 20
resilience.command.default.circuitBreaker.requestVolumeThreshold=50

# After what time (in ms) should the circuit breaker try a single request?
# default: 5000
resilience.command.default.circuitBreaker.sleepWindowInMilliseconds=5000

#resilience.command.default.execution.isolation.strategy=SEMAPHORE
#resilience.command.default.execution.timeout.enabled=true
#resilience.command.default.execution.isolation.thread.timeoutInMilliseconds=10000

resilience.command.Input-Request.execution.isolation.strategy=SEMAPHORE
resilience.command.Input-Request.execution.isolation.thread.timeoutInMilliseconds=20000
#default 10
resilience.command.Input-Request.execution.isolation.semaphore.maxConcurrentRequests=50
#default 10
resilience.command.Input-Request.fallback.isolation.semaphore.maxConcurrentRequests=50

# Include-Request is an include arriving back through this node's own front door - which is what a
# cache-missing <fc:include> does, since it is fetched over HTTP against the Host header. It was
# counted as Input-Request until 2.9.0, so the dashboard's headline traffic figure included the
# node's own fragment fetches; on one production edge that read 1200/s against ~11/s of real client
# traffic.
#
# It needs no stanza here: a command key with nothing set inherits Input-Request above, property by
# property, so an existing file needs no edit and includes keep the limits they already had.
#
# Note what the split does change, since a command key owns its own semaphore and circuit breaker:
# includes and client requests now get one each instead of sharing. That is the point - an include
# storm can no longer eat the permits visitor requests need, and a failing include path no longer
# trips the breaker that serves visitors. It does mean total concurrency across the two is the sum,
# so if the inherited number was sized as a hard ceiling on everything, set it explicitly below.
#resilience.command.Include-Request.execution.isolation.strategy=SEMAPHORE
#resilience.command.Include-Request.execution.isolation.thread.timeoutInMilliseconds=20000
#resilience.command.Include-Request.execution.isolation.semaphore.maxConcurrentRequests=50
#resilience.command.Include-Request.fallback.isolation.semaphore.maxConcurrentRequests=50

# Cache-Bypass - the origin call for a request that never consults the cache (dynamic URLs, POSTs).
resilience.command.Cache-Bypass.execution.isolation.strategy=THREAD
resilience.command.Cache-Bypass.execution.isolation.thread.timeoutInMilliseconds=20000

# Cache-Miss - the origin call behind a cache miss, whichever transport reaches the origin. Until
# 2.9.0 this was two keys, Cache-Origin-http and Cache-Origin-filter, named after the transport
# rather than after what the command does. On a filter-mode node that meant two independent breakers
# over the same origin: the filter chain for the page, HTTP for its includes. Now one.
resilience.command.Cache-Miss.execution.isolation.strategy=THREAD
resilience.command.Cache-Miss.execution.isolation.thread.timeoutInMilliseconds=10000

resilience.command.Cache-Hit.execution.isolation.strategy=SEMAPHORE
resilience.command.Cache-Hit.execution.isolation.thread.timeoutInMilliseconds=1500

resilience.threadpool.default.coreSize=100
# OriginPool - every THREAD-isolated origin call runs here, Cache-Miss and Cache-Bypass both.
# Called OriginHitsPool through 2.8; an un-edited file still configures it under the old name.
resilience.threadpool.OriginPool.coreSize=100

resilience.config.stream.maxConcurrentConnections=15
